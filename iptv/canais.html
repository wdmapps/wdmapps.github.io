<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDM TV - Canais ao Vivo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0066ff; --accent: #00aaff; --bg: #060e1a; --bg-light: #0f1f3d; --text: #e2e8f0; --text-light: #94a3b8; --border: #1e3a5f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { margin: 0; background: url('../img/fundo.jpg') center/cover fixed no-repeat, radial-gradient(circle at center, #0f1f3d 0%, #060e1a 70%, #000 100%); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .glow { position: fixed; border-radius: 50%; filter: blur(130px); opacity: 0.3; pointer-events: none; z-index: 0; animation: float 12s ease-in-out infinite; }
        .glow-1 { width: 450px; height: 450px; background: var(--primary); top: -150px; left: -100px; }
        .glow-2 { width: 380px; height: 380px; background: var(--accent); bottom: -120px; right: -120px; animation-delay: -6s; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }

        .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; }

        .top { display: flex; align-items: center; gap: 16px; padding: 14px 3%; background: rgba(6,14,26,0.7); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(30,58,95,0.5); z-index: 10; }
        .home-btn { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 0.9rem; transition: transform 0.3s; }
        .home-btn:hover { transform: translateY(-2px); }
        .top h1 { font-size: 1.3rem; font-weight: 800; }
        .top h1 span { color: var(--accent); }

        .layout { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 350px; background: rgba(6,14,26,0.75); backdrop-filter: blur(15px); display: flex; flex-direction: column; border-right: 1px solid rgba(30,58,95,0.5); }
        .search-box { padding: 14px; background: rgba(6,14,26,0.6); display: flex; gap: 8px; }
        #search { flex: 1; padding: 11px 15px; border-radius: 10px; border: 1px solid var(--border); background: rgba(15,31,61,0.6); color: white; outline: none; font-size: 0.9rem; }
        #search:focus { border-color: var(--accent); }
        .refresh-btn { width: 44px; flex-shrink: 0; border-radius: 10px; border: 1px solid var(--border); background: rgba(15,31,61,0.6); color: var(--accent); font-size: 1.1rem; cursor: pointer; transition: all 0.3s; }
        .refresh-btn:hover { border-color: var(--accent); background: rgba(0,102,255,0.25); transform: rotate(120deg); }
        .menu-nav { display: flex; padding: 10px; gap: 6px; background: rgba(6,14,26,0.5); }
        .menu-nav button { flex: 1; padding: 8px; background: var(--bg-light); color: var(--text-light); border: 1px solid transparent; cursor: pointer; border-radius: 8px; font-weight: 600; font-size: 0.8rem; transition: all 0.3s; }
        .menu-nav button:hover { border-color: var(--accent); color: white; }
        .list-area { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        .cat-head { padding: 12px 16px; background: rgba(15,31,61,0.5); cursor: pointer; font-weight: 700; border-bottom: 1px solid rgba(30,58,95,0.4); transition: all 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .cat-head:hover { background: rgba(0,102,255,0.15); }
        .cat-head.ativo { background: linear-gradient(90deg, rgba(0,102,255,0.35), rgba(0,170,255,0.15)); border-left: 3px solid var(--accent); }
        .cat-head .num { color: var(--text-light); font-size: 0.75rem; font-weight: 500; }

        .content-area { flex: 1; overflow-y: auto; padding: 20px 3%; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 22px; }
        .canal { border-radius: 16px; overflow: hidden; cursor: pointer; position: relative; border: 1px solid rgba(255,255,255,0.08); background: var(--bg-light); transition: all 0.4s cubic-bezier(0.2,0.8,0.2,1); aspect-ratio: 2/3; }
        .canal:hover { transform: translateY(-8px) scale(1.03); border-color: var(--accent); box-shadow: 0 18px 50px rgba(0,170,255,0.3); }
        .canal .art { width: 100%; height: 100%; object-fit: cover; display: block; }
        .canal .grad { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 12px 12px; background: linear-gradient(transparent, rgba(6,14,26,0.95)); }
        .canal .nome { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .canal .info { font-size: 0.7rem; color: var(--accent); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
        .canal .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #e50914; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .fav-star { position: absolute; top: 8px; right: 10px; color: #ffd700; font-size: 1.1rem; cursor: pointer; opacity: 0.75; z-index: 2; text-shadow: 0 2px 8px rgba(0,0,0,0.8); transition: opacity 0.2s; }
        .fav-star:hover { opacity: 1; }

        @media (max-width: 768px) { .sidebar { width: 40%; min-width: 200px; } .top h1 { font-size: 1rem; } .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
    </style>
</head>
<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="app">
        <div class="top">
            <a href="painel.html" class="home-btn">← Voltar Home</a>
            <h1>WDM <span>TV</span> · Canais ao Vivo</h1>
        </div>

        <div class="layout">
            <div class="sidebar">
                <div class="search-box">
                    <input type="text" id="search" placeholder="Buscar canal..." oninput="buscar()">
                    <button class="refresh-btn" title="Recarregar" onclick="recarregar()">⟳</button>
                </div>
                <div class="menu-nav">
                    <button onclick="renderizarEspecial('recentes')">Recentes</button>
                    <button onclick="renderizarEspecial('favoritos')">Favoritos</button>
                </div>
                <div class="list-area" id="cats"></div>
            </div>

            <div class="content-area">
                <div class="grid" id="grid"></div>
            </div>
        </div>
    </div>

    <script src="config.js?v=3"></script>
    <script src="api.js?v=3"></script>
    <script>
        let todosCanais = [], categorias = []; catAtiva = null;
        const palavrasSenha = ["adulto", "+18", "privado", "xxx", "porn"];

        async function init() {
            const { user, pass } = getCred();
            if (precisaLogin()) { alert("Sessão expirada."); window.location.href = "index.html"; return; }
            try {
                const resCat = await apiFetch("mcp", { username: user, password: pass, action: "get_live_categories", limit: 2000 });
                const resChan = await apiFetch("mcp", { username: user, password: pass, action: "get_live_streams", limit: 5000 });
                categorias = Object.values(await resCat.json());
                todosCanais = await resChan.json();
                renderizarMenuPadrao();
                mostrarTodos();
            } catch (e) { console.error("Erro init:", e); }
        }

        function recarregar() { init(); }

        function renderizarMenuPadrao() {
            const catsDiv = document.getElementById('cats');
            catsDiv.innerHTML = '';
            const head = document.createElement('div');
            head.className = "cat-head ativo";
            head.dataset.id = "todos";
            head.innerHTML = `<span>Todos</span><span class="num">${todosCanais.length}</span>`;
            head.onclick = () => selectCat("todos", head);
            catsDiv.appendChild(head);
            categorias.forEach(c => {
                if (palavrasSenha.some(p => c.category_name.toLowerCase().includes(p))) return;
                const el = document.createElement('div');
                el.className = "cat-head";
                el.dataset.id = c.category_id;
                const qtd = todosCanais.filter(ch => String(ch.category_id) === String(c.category_id)).length;
                el.innerHTML = `<span>${c.category_name}</span><span class="num">${qtd}</span>`;
                el.onclick = () => {
                    if (palavrasSenha.some(p => c.category_name.toLowerCase().includes(p))) {
                        if (prompt("Senha:") !== "0000") return alert("Senha errada!");
                    }
                    selectCat(String(c.category_id), el);
                };
                catsDiv.appendChild(el);
            });
        }

        function selectCat(id, el) {
            document.querySelectorAll('.cat-head').forEach(h => h.classList.remove('ativo'));
            (el || document.querySelector('.cat-head[data-id="' + id + '"]'))?.classList.add('ativo');
            renderizar(id === "todos" ? todosCanais : todosCanais.filter(ch => String(ch.category_id) === String(id)));
        }

        function renderizar(lista) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            if (!lista.length) { grid.innerHTML = "<p style='color:#94a3b8'>Nenhum canal encontrado.</p>"; return; }
            lista.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'canal';
                const arte = ch.stream_icon
                    ? `<img class="art" src="${ch.stream_icon}" onerror="this.remove();">`
                    : `<div class="art" style="display:flex;align-items:center;justify-content:center;font-size:3rem;">📺</div>`;
                card.innerHTML = `
                    <span class="fav-star" onclick="event.stopPropagation(); toggleFavorito('${String(ch.stream_id)}')">★</span>
                    ${art}
                    <div class="grad"><div class="nome">${ch.name}</div><div class="info"><span class="live-dot"></span>AO VIVO</div></div>`;
                card.onclick = () => { abrirCanal(ch); };
                grid.appendChild(card);
            });
        }

        function abrirCanal(ch) {
            const { user, pass } = getCred();
            if (precisaLogin()) return;
            localStorage.setItem("canal_atual", JSON.stringify(ch));
            window.location.href = "ver_canal.html?auto=1";
        }

        function toggleFavorito(streamId) {
            let favs = JSON.parse(localStorage.getItem('favoritos') || '[]');
            const idx = favs.findIndex(f => f.stream_id == streamId);
            if (idx > -1) { favs.splice(idx, 1); alert("Removido!"); }
            else {
                const ch = todosCanais.find(c => c.stream_id == streamId);
                if (ch) { favs.push(ch); alert("Favoritado!"); }
            }
            localStorage.setItem('favoritos', JSON.stringify(favs));
        }

        function renderizarEspecial(tipo) {
            const lista = JSON.parse(localStorage.getItem(tipo) || '[]');
            document.querySelectorAll('.cat-head').forEach(h => h.classList.remove('ativo'));
            renderizar(lista);
        }

        function buscar() {
            const q = document.getElementById('search').value.toLowerCase();
            renderizar(todosCanais.filter(ch => ch.name.toLowerCase().includes(q)).slice(0, 300));
        }

        init();
    </script>
</body>
</html>
