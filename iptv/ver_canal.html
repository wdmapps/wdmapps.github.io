<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDM TV - Assistir Canal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0066ff; --accent: #00aaff; --bg: #060e1a; --bg-light: #0f1f3d; --text: #e2e8f0; --text-light: #94a3b8; --border: #1e3a5f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { margin: 0; background: url('../img/fundo.jpg') center/cover fixed no-repeat, radial-gradient(circle at center, #0f1f3d 0%, #060e1a 70%, #000 100%); min-height: 100vh; color: white; display: flex; flex-direction: column; }
        .glow { position: fixed; border-radius: 50%; filter: blur(130px); opacity: 0.25; pointer-events: none; animation: float 12s ease-in-out infinite; }
        .glow-1 { width: 400px; height: 400px; background: var(--primary); top: -120px; left: -80px; }
        .glow-2 { width: 350px; height: 350px; background: var(--accent); bottom: -100px; right: -100px; animation-delay: -6s; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }

        .top { display: flex; align-items: center; gap: 16px; padding: 14px 3%; background: rgba(6,14,26,0.75); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(30,58,95,0.5); position: relative; z-index: 1; }
        .home-btn { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 0.9rem; transition: transform 0.3s; }
        .home-btn:hover { transform: translateY(-2px); }
        .top h1 { font-size: 1.3rem; font-weight: 800; }
        .top h1 span { color: var(--accent); }

        .player-wrap { position: relative; z-index: 1; padding: 24px 3%; display: flex; flex-direction: column; align-items: center; flex: 1; }
        #canal-nome { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; color: var(--text); display: flex; align-items: center; gap: 10px; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: #e50914; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #main-player { width: 100%; max-width: 1100px; max-height: 80vh; background: #000; border-radius: 16px; outline: none; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    </style>
</head>
<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="top">
        <a href="canais.html" class="home-btn">← Voltar</a>
        <h1>WDM <span>TV</span> · Canal</h1>
    </div>

    <div class="player-wrap">
        <div id="canal-nome">Carregando canal...</div>
        <video id="main-player" controls autoplay playsinline></video>
    </div>

    <script src="config.js?v=3"></script>
    <script src="api.js?v=3"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const canal = JSON.parse(localStorage.getItem("canal_atual") || "null");
        const auto = new URLSearchParams(location.search).has('auto');

        let hls = null, canalAtual = null, timerReconexao = null, falhas = 0, ultimoErro = '';
        const video = document.getElementById('main-player');
        const nomeEl = document.getElementById('canal-nome');

        function registrarRecente(ch) {
            let rec = JSON.parse(localStorage.getItem('recentes') || '[]');
            rec = rec.filter(r => r.stream_id != ch.stream_id);
            rec.unshift(ch);
            localStorage.setItem('recentes', JSON.stringify(rec.slice(0, 6)));
        }

        function status(texto, cor = '#e2e8f0') {
            nomeEl.innerHTML = texto;
            nomeEl.style.color = cor;
        }

        function reconectar() {
            clearTimeout(timerReconexao);
            if (hls) { hls.destroy(); hls = null; }
            falhas++;
            if (falhas > 12) {
                status(`<span class="dot"></span>Não foi possível carregar o canal.<br><small>Último erro: ${ultimoErro || 'desconhecido'}</small><br><button onclick="location.reload()" style="margin-top:8px;padding:6px 16px;border:none;border-radius:8px;background:#0066ff;color:white;cursor:pointer">Tentar de novo</button>`, '#e50914');
                return;
            }
            status(`<span class="dot"></span>Reconectando: ${canalAtual ? canalAtual.name : ''}...`);
            timerReconexao = setTimeout(iniciar, 1500);
        }

        function iniciar() {
            if (!canal) { window.location.href = "canais.html"; return; }
            if (precisaLogin()) { window.location.href = "index.html"; return; }
            canalAtual = canal;
            status(`<span class="dot"></span>Assistindo: ${canal.name}`);
            registrarRecente(canal);

            const streamUrl = liveUrl(canal.stream_id);
            if (hls) { hls.destroy(); hls = null; }
            video.removeAttribute('src'); video.load();

            if (window.Hls && Hls.isSupported()) {
                hls = new Hls({
                    lowLatencyMode: false,
                    maxBufferLength: 30, maxMaxBufferLength: 60, enableWorker: false,
                    liveDurationInfinity: true, liveSyncDurationCount: 4, liveMaxLatencyDurationCount: 12,
                    manifestLoadingTimeOut: 15000, manifestLoadingMaxRetry: 2, manifestLoadingRetryDelay: 1000,
                    levelLoadingTimeOut: 15000, levelLoadingMaxRetry: 2, levelLoadingRetryDelay: 1000,
                    fragLoadingTimeOut: 15000, fragLoadingMaxRetry: 3, fragLoadingRetryDelay: 1000
                });

                hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });

                hls.on(Hls.Events.ERROR, (e, data) => {
                    if (!data.fatal) return;
                    const info = data.details || data.type;
                    const code = data.response && data.response.code ? ' (HTTP ' + data.response.code + ')' : '';
                    const urlFalha = data.url || data.frag && data.frag.url || '';
                    ultimoErro = `${info}${code}${urlFalha ? ' · ' + urlFalha : ''}`;
                    console.error('HLS fatal:', ultimoErro, data);
                    if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        hls.recoverMediaError();
                        return;
                    }
                    clearTimeout(timerReconexao);
                    timerReconexao = setTimeout(reconectar, 800);
                });

                hls.loadSource(streamUrl);
                hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play().catch(() => {});
            } else {
                status('Navegador sem suporte a HLS.', '#e50914');
            }
        }

        video.addEventListener('playing', () => { falhas = 0; });

        iniciar();
    </script>
</body>
</html>
