<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDM TV - Painel</title>
    <style>
        :root { --primary: #0066ff; --accent: #00aaff; --bg: #0a1628; --bg-light: #0f1f3d; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: radial-gradient(circle at center, #0f1f3d 0%, #060e1a 100%);
            color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 4%; background: rgba(6,14,26,0.7); border-bottom: 1px solid #1e3a5f;
        }
        .ticker { font-size: 1.4rem; font-weight: 600; color: #fff; width: 60%; }
        .user-panel { display: flex; align-items: center; gap: 20px; font-size: 1rem; }
        #clock { font-family: monospace; font-size: 1.2rem; color: #00aaff; }

        header { padding: 20px 4%; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo img { max-height: 100px; }

        .menu-wrapper { max-width: 1100px; margin: 50px auto; padding: 0 4%; }
        .grid-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .glass-btn {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 50px 30px;
            display: flex; flex-direction: column; align-items: center; gap: 20px; cursor: pointer; transition: 0.3s;
            text-decoration: none; color: white; text-align: center;
        }
        .glass-btn:hover { background: rgba(0, 102, 255, 0.15); border-color: var(--primary); transform: translateY(-10px); }
        .icon-size { font-size: 4.5rem; }

        .recents-container { padding: 60px 4%; }
        .slider-row { display: flex; overflow: hidden; padding: 10px 0; }
        .slider-track { display: flex; gap: 20px; width: max-content; will-change: transform; animation: sliderScroll 45s linear infinite; }
        .slider-row:hover .slider-track { animation-play-state: paused; }
        @keyframes sliderScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .vod-item { min-width: 180px; height: 260px; background: #0f1f3d; border: 1px solid #1e3a5f; border-radius: 10px; cursor: pointer; transition: 0.3s; position: relative; }
        .vod-item:hover { transform: scale(1.05); border-color: var(--accent); }
        .vod-item-title { position: absolute; bottom: 0; width: 100%; padding: 12px; background: rgba(6,14,26,0.9); font-size: 0.85rem; text-align: center; border-radius: 0 0 10px 10px; }

        @media (max-width: 768px) {
            .grid-menu { grid-template-columns: 1fr; }
            .ticker { font-size: 1rem; width: 45%; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="ticker"><marquee scrollamount="6">WDM TV — A melhor experiência em entretenimento</marquee></div>
        <div class="user-panel">
            <div id="clock">00:00:00</div>
            <span>Olá, <b><span id="lblUser">...</span></b></span>
            <button onclick="efetuarLogout()" style="background:var(--primary); border:none; color:white; padding:8px 20px; cursor:pointer; border-radius:6px; font-weight:bold;">Sair</button>
        </div>
    </div>

    <header>
        <div class="brand-logo"><img src="../img/logo-wdm-iptv.png" alt="WDM TV" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend', '<h1 style=color:#fff>WDM TV</h1>')"></div>
    </header>

    <main class="menu-wrapper">
        <div class="grid-menu">
            <a href="#" class="glass-btn"><div class="icon-size">📺</div><h2>Canais</h2></a>
            <a href="#" class="glass-btn"><div class="icon-size">🎬</div><h2>Filmes</h2></a>
            <a href="#" class="glass-btn"><div class="icon-size">🍿</div><h2>Séries</h2></a>
        </div>
    </main>

    <section class="recents-container">
        <h3 style="margin-bottom:20px;">Adicionados Recentemente</h3>
        <div class="slider-row" id="carouselRow"><div class="slider-track" id="carouselTrack"></div></div>
    </section>

    <script>
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
        document.getElementById("lblUser").innerText = localStorage.getItem("username") || "Visitante";

        function efetuarLogout() { localStorage.clear(); window.location.href = "index.html"; }

        const demo = [
            { name: "Demo 01", color: "#1e3a5f" }, { name: "Demo 02", color: "#0052cc" },
            { name: "Demo 03", color: "#00aaff" }, { name: "Demo 04", color: "#0f1f3d" },
            { name: "Demo 05", color: "#3385ff" }
        ];

        function criarCard(item) {
            const card = document.createElement("div");
            card.className = "vod-item";
            card.innerHTML = `<div style="width:100%;height:85%;background:linear-gradient(135deg,${item.color},#060e1a);display:flex;align-items:center;justify-content:center;font-size:2.5rem;border-radius:10px 10px 0 0;">🎬</div><div class="vod-item-title">${item.name}</div>`;
            return card;
        }

        const track = document.getElementById("carouselTrack");
        demo.forEach(i => track.appendChild(criarCard(i)));
        demo.forEach(i => track.appendChild(criarCard(i)));
    </script>
</body>
</html>
