<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#185abd">
<title>WDM Docs</title>
<style>
:root{font-family:"Segoe UI",Arial,sans-serif;color:#1f2937;background:#e9edf3;--word:#185abd;--word2:#0f4c9f;--line:#d5dbe5;--soft:#f7f9fc;--muted:#687386}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9edf3;color:#1f2937}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{min-height:52px;background:linear-gradient(90deg,var(--word2),var(--word));color:#fff;display:grid;grid-template-columns:auto minmax(240px,1fr) auto;align-items:center;gap:16px;padding:7px 14px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}.wordmark{width:34px;height:34px;background:#fff;color:var(--word);border-radius:5px;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 1px 3px #0002}.brand small{display:block;opacity:.8;font-size:10px;letter-spacing:.12em}.brand strong{font-size:15px}.titlebox{justify-self:center;width:min(520px,100%)}.titlebox input{width:100%;border:1px solid #ffffff55;background:#ffffff14;color:#fff;border-radius:6px;padding:7px 11px;text-align:center;outline:none}.titlebox input:focus{background:#fff;color:#1f2937;border-color:#fff;text-align:left}.top-actions{display:flex;align-items:center;gap:8px}.save-state{font-size:12px;opacity:.92;white-space:nowrap}.switch-app{border:1px solid #ffffff55;background:#ffffff15;color:#fff;border-radius:6px;padding:7px 10px}.switch-app:hover{background:#ffffff26}.filebar{min-height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:7px 12px;overflow-x:auto}.filebar button{border:1px solid #cfd6e1;background:#fff;border-radius:5px;padding:7px 10px;white-space:nowrap}.filebar button:hover{background:#f4f6f9}.filebar .primary{background:var(--word);border-color:var(--word);color:#fff}.filebar .primary:hover{background:var(--word2)}.ribbon-tabs{height:35px;background:#fff;display:flex;align-items:end;padding-left:12px;border-bottom:1px solid var(--line);gap:3px}.ribbon-tabs button{height:34px;border:0;background:transparent;padding:0 13px;color:#39465a}.ribbon-tabs button.active{color:var(--word);font-weight:650;border-bottom:3px solid var(--word)}.ribbon{min-height:84px;background:#fff;border-bottom:1px solid var(--line);padding:7px 10px;display:flex;align-items:stretch;gap:8px;overflow-x:auto;position:sticky;top:52px;z-index:25}.panel{display:flex;align-items:center;gap:5px;white-space:nowrap}.panel.hidden{display:none}.group{display:flex;align-items:center;gap:5px;padding:0 9px;border-right:1px solid #e0e5ec;position:relative}.group:last-child{border-right:0}.group::after{content:attr(data-label);position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:9px;color:#8a94a5}.toolbtn{border:1px solid transparent;background:#fff;border-radius:4px;min-width:32px;height:32px;padding:4px 7px;color:#263244}.toolbtn:hover{background:#eef3f9;border-color:#d9e1eb}.toolbtn.icon{font-size:16px}.toolbtn.wide{min-width:auto}.select{height:31px;border:1px solid #cfd6e1;border-radius:4px;background:#fff;padding:0 7px;color:#263244}.font-select{width:135px}.size-select{width:62px}.colorwrap{display:flex;align-items:center;border:1px solid #cfd6e1;border-radius:4px;height:32px;padding:2px 5px;gap:4px}.colorwrap input{width:24px;height:24px;border:0;padding:0;background:transparent}.workspace{flex:1;overflow:auto;padding:20px 16px 60px}.ruler{width:min(816px,96vw);height:20px;margin:0 auto;background:#fff;border:1px solid #d4dae3;border-bottom:0;position:relative;background-image:repeating-linear-gradient(90deg,transparent 0 23px,#c8ced8 24px)}.paper-wrap{width:min(816px,96vw);margin:0 auto;transform-origin:top center}.paper{width:816px;max-width:100%;min-height:1056px;background:#fff;box-shadow:0 6px 24px #1f293722;outline:none;padding:76px 86px;font-family:Calibri,Arial,sans-serif;font-size:12pt;line-height:1.5;overflow-wrap:anywhere}.paper:focus{box-shadow:0 8px 28px #1f29372b}.paper[data-margin="narrow"]{padding:45px 48px}.paper[data-margin="wide"]{padding:95px 110px}.paper p{margin:0 0 10px}.paper h1{font-size:24pt;font-weight:600;margin:0 0 14px}.paper h2{font-size:18pt;font-weight:600;margin:0 0 12px}.statusbar{height:30px;background:#fff;border-top:1px solid var(--line);position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;color:#5f6b7d}.status-left,.status-right{display:flex;align-items:center;gap:15px}.zoom-range{width:100px}.modal-backdrop{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;z-index:80;padding:20px}.modal-backdrop.show{display:flex}.modal{width:min(650px,96vw);max-height:78vh;background:#fff;border-radius:10px;box-shadow:0 20px 60px #0005;overflow:hidden;display:flex;flex-direction:column}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:18px}.close-modal{border:0;background:#eef2f6;border-radius:6px;width:32px;height:32px}.saved-list{padding:12px;overflow:auto}.empty{padding:30px;text-align:center;color:var(--muted)}.saved-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 12px;border:1px solid #e0e5ec;border-radius:8px;margin-bottom:8px}.saved-item:hover{border-color:#aebcd0;background:#fafcff}.saved-main{border:0;background:transparent;text-align:left;padding:0;min-width:0}.saved-main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-main span{font-size:11px;color:var(--muted)}.delete-doc{border:1px solid #e3b7b7;background:#fff5f5;color:#a12626;border-radius:6px;padding:6px 9px}.hint{font-size:11px;color:var(--muted);padding:0 16px 14px}.sep{width:1px;height:24px;background:#dce2e9}.kbd{font-size:10px;color:#8590a1;margin-left:3px}@media print{.topbar,.filebar,.ribbon-tabs,.ribbon,.statusbar,.ruler{display:none!important}.workspace{padding:0;background:#fff}.paper-wrap{width:auto;margin:0}.paper{box-shadow:none;width:auto;min-height:0;padding:0!important;zoom:1!important}}@media(max-width:780px){.topbar{grid-template-columns:1fr auto}.titlebox{grid-column:1/-1;grid-row:2;width:100%}.save-state{display:none}.ribbon{top:93px}.workspace{padding:10px 0 55px}.ruler,.paper-wrap{width:96vw}.paper{padding:46px 34px}.status-right .label{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="wordmark">W</div><div><small>WDM OFFICE</small><strong>WDM Docs</strong></div></div>
  <div class="titlebox"><input id="docName" value="Documento sem título" maxlength="90" aria-label="Nome do documento"></div>
  <div class="top-actions"><span id="saveState" class="save-state">Novo documento</span><button class="switch-app" id="goSheets">📊 Planilhas</button></div>
</header>
<section class="filebar">
  <button id="newBtn">＋ Novo <span class="kbd">Ctrl+N</span></button>
  <button id="openSavedBtn">📂 Abrir do navegador <span class="kbd">Ctrl+O</span></button>
  <button id="openFileBtn">🗂 Abrir arquivo</button>
  <button id="saveBrowserBtn" class="primary">💾 Salvar no navegador <span class="kbd">Ctrl+S</span></button>
  <span class="sep"></span>
  <button id="downloadBtn">⬇ Salvar como Word</button>
  <button id="printBtn">🖨 Imprimir / PDF <span class="kbd">Ctrl+P</span></button>
  <input id="fileInput" type="file" accept=".txt,.html,.htm,.doc,.docx" hidden>
</section>
<nav class="ribbon-tabs" aria-label="Guias do WDM Docs">
  <button class="active" data-tab="home">Início</button>
  <button data-tab="insert">Inserir</button>
  <button data-tab="layout">Layout</button>
</nav>
<section class="ribbon">
  <div class="panel" data-panel="home">
    <div class="group" data-label="Desfazer"><button class="toolbtn icon" data-cmd="undo" title="Desfazer">↶</button><button class="toolbtn icon" data-cmd="redo" title="Refazer">↷</button></div>
    <div class="group" data-label="Estilos"><select id="styleSelect" class="select"><option value="p">Normal</option><option value="h1">Título 1</option><option value="h2">Título 2</option></select></div>
    <div class="group" data-label="Fonte">
      <select id="fontSelect" class="select font-select"><option>Calibri</option><option>Arial</option><option>Segoe UI</option><option>Georgia</option><option>Times New Roman</option><option>Verdana</option></select>
      <select id="fontSize" class="select size-select"><option value="2">10</option><option value="3" selected>12</option><option value="4">14</option><option value="5">18</option><option value="6">24</option><option value="7">32</option></select>
      <button class="toolbtn" data-cmd="bold" title="Negrito"><b>N</b></button><button class="toolbtn" data-cmd="italic" title="Itálico"><i>I</i></button><button class="toolbtn" data-cmd="underline" title="Sublinhado"><u>S</u></button><button class="toolbtn" data-cmd="strikeThrough" title="Tachado"><s>abc</s></button>
      <div class="colorwrap" title="Cor da fonte"><span>A</span><input id="fontColor" type="color" value="#111827"></div><div class="colorwrap" title="Realce"><span>▰</span><input id="highlightColor" type="color" value="#fff59d"></div>
      <button class="toolbtn" data-cmd="removeFormat" title="Limpar formatação">A⌫</button>
    </div>
    <div class="group" data-label="Parágrafo"><button class="toolbtn icon" data-cmd="justifyLeft" title="Esquerda">☰</button><button class="toolbtn icon" data-cmd="justifyCenter" title="Centralizar">≡</button><button class="toolbtn icon" data-cmd="justifyRight" title="Direita">☷</button><button class="toolbtn wide" data-cmd="justifyFull" title="Justificar">Just.</button><button class="toolbtn wide" data-cmd="insertUnorderedList">• Lista</button><button class="toolbtn wide" data-cmd="insertOrderedList">1. Lista</button><button class="toolbtn" data-cmd="outdent" title="Diminuir recuo">⇤</button><button class="toolbtn" data-cmd="indent" title="Aumentar recuo">⇥</button></div>
  </div>
  <div class="panel hidden" data-panel="insert">
    <div class="group" data-label="Links"><button class="toolbtn wide" id="linkBtn">🔗 Link</button><button class="toolbtn wide" data-cmd="unlink">Remover link</button></div>
    <div class="group" data-label="Elementos"><button class="toolbtn wide" id="hrBtn">― Linha horizontal</button><button class="toolbtn wide" id="dateBtn">📅 Data e hora</button></div>
  </div>
  <div class="panel hidden" data-panel="layout">
    <div class="group" data-label="Margens"><select id="marginSelect" class="select"><option value="normal">Margens normais</option><option value="narrow">Margens estreitas</option><option value="wide">Margens largas</option></select></div>
    <div class="group" data-label="Espaçamento"><select id="lineHeight" class="select"><option value="1.15">1,15</option><option value="1.5" selected>1,5</option><option value="2">2,0</option></select></div>
    <div class="group" data-label="Exibição"><select id="zoomSelect" class="select"><option>75</option><option>90</option><option selected>100</option><option>110</option><option>125</option><option>150</option></select><span>%</span><button class="toolbtn wide" id="printBtn2">🖨 Imprimir / PDF</button></div>
  </div>
</section>
<main class="workspace">
  <div class="ruler" aria-hidden="true"></div>
  <div class="paper-wrap" id="paperWrap"><article id="editor" class="paper" data-margin="normal" contenteditable="true" spellcheck="true" aria-label="Documento"></article></div>
</main>
<footer class="statusbar"><div class="status-left"><span id="wordCount">0 palavras</span><span id="charCount">0 caracteres</span><span>Página 1</span></div><div class="status-right"><span class="label">Zoom</span><input id="zoomRange" class="zoom-range" type="range" min="60" max="160" value="100"><span id="zoomLabel">100%</span></div></footer>
</div>
<div id="savedModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="savedTitle"><section class="modal"><div class="modal-head"><h2 id="savedTitle">Documentos salvos neste navegador</h2><button class="close-modal" id="closeModal">×</button></div><div id="savedList" class="saved-list"></div><div class="hint">Os documentos ficam armazenados somente neste navegador e neste dispositivo.</div></section></div>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script>
(()=>{
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const editor=$('#editor'), docName=$('#docName'), saveState=$('#saveState'), modal=$('#savedModal'), savedList=$('#savedList');
  const LIB_KEY='wdm-docs-library-v1'; let currentId=null, dirty=false, zoom=100;
  const uid=()=>globalThis.crypto?.randomUUID?.()||('doc-'+Date.now()+'-'+Math.random().toString(36).slice(2));
  const safeName=s=>String(s||'Documento sem título').trim().replace(/[\\/:*?"<>|]+/g,'-')||'Documento sem título';
  const markDirty=()=>{dirty=true;saveState.textContent='Alterações não salvas'};
  const setClean=t=>{dirty=false;saveState.textContent=t};
  const hasContent=()=>editor.innerText.trim().length>0||editor.querySelector('img,table,hr');
  const canDiscard=()=>!dirty||!hasContent()||confirm('Há alterações não salvas. Deseja continuar sem salvar?');
  function library(){try{const x=JSON.parse(localStorage.getItem(LIB_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
  function writeLibrary(items){localStorage.setItem(LIB_KEY,JSON.stringify(items))}
  function updateCount(){const t=editor.innerText.replace(/\u00a0/g,' ').trim();const words=t?t.split(/\s+/).length:0;$('#wordCount').textContent=words+' '+(words===1?'palavra':'palavras');$('#charCount').textContent=editor.innerText.length+' caracteres'}
  function newDoc(force=false){if(!force&&!canDiscard())return;currentId=null;editor.innerHTML='';docName.value='Documento sem título';editor.dataset.margin='normal';$('#marginSelect').value='normal';$('#lineHeight').value='1.5';editor.style.lineHeight='1.5';setZoom(100);updateCount();setClean('Novo documento');editor.focus()}
  function saveBrowser(){const name=docName.value.trim()||'Documento sem título';const items=library();const now=new Date().toISOString();if(!currentId)currentId=uid();const doc={id:currentId,name,html:editor.innerHTML,margin:editor.dataset.margin||'normal',lineHeight:editor.style.lineHeight||'1.5',updated:now};const i=items.findIndex(x=>x.id===currentId);if(i>=0)items[i]=doc;else items.unshift(doc);writeLibrary(items);docName.value=name;setClean('Salvo no navegador');renderSaved();flash('Documento salvo neste navegador')}
  function openSaved(id){if(!canDiscard())return;const d=library().find(x=>x.id===id);if(!d)return;currentId=d.id;docName.value=d.name||'Documento sem título';editor.innerHTML=d.html||'';editor.dataset.margin=d.margin||'normal';$('#marginSelect').value=editor.dataset.margin;editor.style.lineHeight=d.lineHeight||'1.5';$('#lineHeight').value=d.lineHeight||'1.5';updateCount();setClean('Aberto do navegador');closeModal();editor.focus()}
  function deleteSaved(id){const d=library().find(x=>x.id===id);if(!d)return;if(!confirm('Excluir "'+d.name+'" deste navegador?'))return;writeLibrary(library().filter(x=>x.id!==id));if(currentId===id){currentId=null;setClean('Documento não salvo')}renderSaved()}
  function renderSaved(){const items=library().sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));savedList.innerHTML='';if(!items.length){savedList.innerHTML='<div class="empty">Nenhum documento salvo ainda.<br>Use <b>Salvar no navegador</b> para guardar um documento aqui.</div>';return}items.forEach(d=>{const row=document.createElement('div');row.className='saved-item';const main=document.createElement('button');main.className='saved-main';const when=d.updated?new Date(d.updated).toLocaleString('pt-BR'):'Data desconhecida';main.innerHTML='<strong></strong><span></span>';main.querySelector('strong').textContent=d.name||'Documento sem título';main.querySelector('span').textContent='Salvo em '+when;main.onclick=()=>openSaved(d.id);const del=document.createElement('button');del.className='delete-doc';del.textContent='Excluir';del.onclick=e=>{e.stopPropagation();deleteSaved(d.id)};row.append(main,del);savedList.appendChild(row)})}
  function showModal(){renderSaved();modal.classList.add('show')}
  function closeModal(){modal.classList.remove('show')}
  function flash(text){saveState.textContent=text;clearTimeout(flash.t);flash.t=setTimeout(()=>{saveState.textContent=dirty?'Alterações não salvas':(currentId?'Salvo no navegador':'Novo documento')},1800)}
  function cmd(name,value=null){editor.focus();document.execCommand(name,false,value);markDirty();updateCount()}
  function setZoom(v){zoom=Math.max(60,Math.min(160,Number(v)||100));editor.style.zoom=zoom+'%';$('#zoomRange').value=zoom;$('#zoomSelect').value=String([75,90,100,110,125,150].reduce((a,b)=>Math.abs(b-zoom)<Math.abs(a-zoom)?b:a,100));$('#zoomLabel').textContent=zoom+'%'}
  function sanitizeHtml(html){const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,iframe,object,embed,style').forEach(x=>x.remove());doc.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{if(/^on/i.test(a.name))el.removeAttribute(a.name)}));return doc.body.innerHTML}
  async function openFile(file){if(!file||!canDiscard())return;currentId=null;docName.value=file.name.replace(/\.[^.]+$/,'')||'Documento sem título';const ext=file.name.split('.').pop().toLowerCase();try{if(ext==='docx'&&window.mammoth){const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});editor.innerHTML=sanitizeHtml(r.value||'')}else{const text=await file.text();if(['html','htm','doc'].includes(ext)&&/<[^>]+>/.test(text))editor.innerHTML=sanitizeHtml(text);else{editor.textContent=text}}updateCount();dirty=true;saveState.textContent='Arquivo aberto · não salvo';editor.focus()}catch(e){console.error(e);alert('Não foi possível abrir esse arquivo.') }}
  function downloadWord(){const title=safeName(docName.value);const html='<!doctype html><html><head><meta charset="utf-8"><title>'+escapeHtml(docName.value)+'</title><style>body{font-family:Calibri,Arial,sans-serif;font-size:12pt;line-height:'+(editor.style.lineHeight||'1.5')+';margin:2.5cm}'+(editor.dataset.margin==='narrow'?'body{margin:1.3cm}':'')+(editor.dataset.margin==='wide'?'body{margin:3.2cm}':'')+'</style></head><body>'+editor.innerHTML+'</body></html>';downloadBlob(new Blob(['\ufeff',html],{type:'application/msword'}),title+'.doc');flash('Arquivo Word baixado')}
  function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
  $$('.ribbon-tabs button').forEach(b=>b.onclick=()=>{$$('.ribbon-tabs button').forEach(x=>x.classList.toggle('active',x===b));$$('[data-panel]').forEach(p=>p.classList.toggle('hidden',p.dataset.panel!==b.dataset.tab))});
  $$('[data-cmd]').forEach(b=>b.onclick=()=>cmd(b.dataset.cmd));
  $('#fontSelect').onchange=e=>cmd('fontName',e.target.value);$('#fontSize').onchange=e=>cmd('fontSize',e.target.value);$('#fontColor').oninput=e=>cmd('foreColor',e.target.value);$('#highlightColor').oninput=e=>cmd('backColor',e.target.value);$('#styleSelect').onchange=e=>cmd('formatBlock',e.target.value);
  $('#linkBtn').onclick=()=>{const u=prompt('Cole o endereço do link:');if(u)cmd('createLink',u)};$('#hrBtn').onclick=()=>cmd('insertHorizontalRule');$('#dateBtn').onclick=()=>cmd('insertText',new Date().toLocaleString('pt-BR'));
  $('#marginSelect').onchange=e=>{editor.dataset.margin=e.target.value;markDirty()};$('#lineHeight').onchange=e=>{editor.style.lineHeight=e.target.value;markDirty()};$('#zoomSelect').onchange=e=>setZoom(e.target.value);$('#zoomRange').oninput=e=>setZoom(e.target.value);
  editor.addEventListener('input',()=>{markDirty();updateCount()});docName.addEventListener('input',markDirty);
  $('#newBtn').onclick=()=>newDoc();$('#saveBrowserBtn').onclick=saveBrowser;$('#openSavedBtn').onclick=showModal;$('#openFileBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{await openFile(e.target.files?.[0]);e.target.value=''};$('#downloadBtn').onclick=downloadWord;$('#printBtn').onclick=()=>window.print();$('#printBtn2').onclick=()=>window.print();$('#closeModal').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});$('#goSheets').onclick=()=>location.href='/office/?app=sheets';
  document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();if(k==='s'){e.preventDefault();saveBrowser()}else if(k==='n'){e.preventDefault();newDoc()}else if(k==='o'){e.preventDefault();showModal()}else if(k==='p'){e.preventDefault();window.print()}});
  window.addEventListener('beforeunload',e=>{if(dirty&&hasContent()){e.preventDefault();e.returnValue=''}});
  newDoc(true);
})();
</script>
</body>
</html>
