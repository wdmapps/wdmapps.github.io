<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>WDM Office</title>
  <link rel="stylesheet" href="office.css">
</head>
<body>
  <main class="office-shell" data-app="docs" id="officeShell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">W</div><div><strong>WDM Office</strong><span id="appSubtitle">Docs</span></div></div>
      <nav class="app-switcher" aria-label="Aplicativos do WDM Office">
        <button class="app-tab active" type="button" data-switch="docs">📝 Docs</button>
        <button class="app-tab" type="button" data-switch="sheets">📊 Planilhas</button>
      </nav>
      <div class="save-state" id="saveState">Salvo neste navegador</div>
    </header>
    <section class="commandbar">
      <div class="file-actions">
        <button type="button" id="newBtn">＋ Novo</button><button type="button" id="openBtn">📂 Abrir</button><button type="button" id="saveBtn" class="primary">💾 Salvar</button><button type="button" id="downloadBtn">⬇ Baixar</button><input id="fileInput" type="file" hidden>
      </div>
      <label class="title-field"><span>Nome</span><input id="fileName" value="Documento sem título" maxlength="80"></label>
    </section>
    <section class="toolbar docs-toolbar" id="docsToolbar" aria-label="Ferramentas de texto">
      <button type="button" data-cmd="undo" title="Desfazer">↶</button><button type="button" data-cmd="redo" title="Refazer">↷</button><span class="separator"></span>
      <select id="fontName" title="Fonte"><option value="Arial">Arial</option><option value="Calibri">Calibri</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option><option value="Verdana">Verdana</option></select>
      <select id="fontSize" title="Tamanho"><option value="2">10</option><option value="3" selected>12</option><option value="4">14</option><option value="5">18</option><option value="6">24</option><option value="7">32</option></select><span class="separator"></span>
      <button type="button" data-cmd="bold" title="Negrito"><b>N</b></button><button type="button" data-cmd="italic" title="Itálico"><i>I</i></button><button type="button" data-cmd="underline" title="Sublinhado"><u>S</u></button><input type="color" id="foreColor" value="#111827" title="Cor do texto"><span class="separator"></span>
      <button type="button" data-cmd="justifyLeft" title="Alinhar à esquerda">☰</button><button type="button" data-cmd="justifyCenter" title="Centralizar">≡</button><button type="button" data-cmd="justifyRight" title="Alinhar à direita">☷</button><button type="button" data-cmd="insertUnorderedList" title="Lista">• Lista</button><button type="button" data-cmd="insertOrderedList" title="Lista numerada">1. Lista</button><button type="button" id="linkBtn" title="Inserir link">🔗</button>
    </section>
    <section class="toolbar sheet-toolbar hidden" id="sheetToolbar" aria-label="Ferramentas de planilha"><div class="name-box" id="cellName">A1</div><div class="fx">fx</div><input id="formulaInput" placeholder="Digite um valor ou fórmula, por exemplo =SUM(A1:A5)"><button type="button" id="addRowBtn">＋ Linha</button><button type="button" id="addColBtn">＋ Coluna</button></section>
    <section class="workspace docs-workspace" id="docsWorkspace"><div class="ruler"><span></span></div><article id="docEditor" class="paper" contenteditable="true" spellcheck="true"><h1>Documento sem título</h1><p>Comece a escrever aqui...</p></article><footer class="doc-status"><span id="wordCount">4 palavras</span><span>WDM Docs</span></footer></section>
    <section class="workspace sheet-workspace hidden" id="sheetWorkspace"><div class="sheet-scroll"><table id="sheetTable" class="sheet-table" aria-label="Planilha"></table></div><footer class="sheet-status"><button type="button" class="sheet-tab-name active">Planilha1</button><span id="sheetInfo">Pronto</span></footer></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="office.js"></script>
</body>
</html>
