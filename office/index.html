<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WDM Office</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;--accent:#2563eb;--line:#d9e0e8;--bg:#eef2f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033}button,input,select{font:inherit}button{cursor:pointer}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;display:grid;place-items:center;font-weight:800}.tabs{display:flex;gap:4px;background:#edf1f6;padding:4px;border-radius:10px}.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:7px}.tabs button.active{background:#fff;color:var(--accent);font-weight:700}.bar,.tools{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.bar button,.tools button{border:1px solid #d5dce7;background:#fff;border-radius:7px;padding:7px 10px}.bar .primary{background:var(--accent);color:#fff;border-color:var(--accent)}.bar input{border:1px solid #d5dce7;border-radius:7px;padding:8px 10px;min-width:230px}.hidden{display:none!important}.docs{padding:20px;overflow:auto}.paper{width:min(816px,96vw);min-height:1056px;margin:auto;background:#fff;padding:70px 80px;box-shadow:0 5px 22px #0f172a17;outline:none;line-height:1.55}.paper h1{margin-top:0}.tools select,.tools input[type=color],#formula{height:34px;border:1px solid #d5dce7;border-radius:7px;background:#fff}.tools select{padding:0 8px}#formula{flex:1;min-width:260px;padding:0 10px}.sheetwrap{overflow:auto;max-height:calc(100vh - 180px);background:#fff}table{border-collapse:separate;border-spacing:0;min-width:max-content;font-size:13px}th,td{height:28px;border-right:1px solid #d9dee7;border-bottom:1px solid #d9dee7}th{background:#f3f5f8;position:sticky;z-index:2;text-align:center;color:#475569}.col{top:0;min-width:104px}.row{left:0;min-width:46px;z-index:3}.corner{top:0;left:0;min-width:46px;z-index:4}td{min-width:104px;background:#fff;padding:0}td input{width:100%;height:100%;border:0;outline:0;padding:4px 7px;background:transparent}td.sel{outline:2px solid #16803c;outline-offset:-2px}.status{background:#fff;border-top:1px solid var(--line);padding:8px 14px;color:#64748b;font-size:12px}.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:10px 14px;border-radius:9px;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:700px){.top{height:auto;padding:8px;flex-wrap:wrap}.paper{padding:40px 30px}.bar input{min-width:160px}.tools{overflow:auto;flex-wrap:nowrap}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">W</div><div><strong>WDM Office</strong><div id="subtitle" style="font-size:12px;color:#64748b">Docs</div></div></div><div class="tabs"><button id="tabDocs" class="active">📝 Docs</button><button id="tabSheets">📊 Planilhas</button></div><small id="saveState">Salvo neste navegador</small></header>
<section class="bar"><button id="newBtn">＋ Novo</button><button id="openBtn">📂 Abrir</button><button id="saveBtn" class="primary">💾 Salvar</button><button id="downloadBtn">⬇ Baixar</button><input id="name" value="Documento sem título"><input id="file" type="file" hidden></section>
<section id="docTools" class="tools"><button data-cmd="undo">↶</button><button data-cmd="redo">↷</button><select id="font"><option>Arial</option><option>Calibri</option><option>Georgia</option><option>Times New Roman</option></select><select id="size"><option value="2">10</option><option value="3" selected>12</option><option value="4">14</option><option value="5">18</option><option value="6">24</option></select><button data-cmd="bold"><b>N</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>S</u></button><input id="color" type="color" value="#111827"><button data-cmd="justifyLeft">☰</button><button data-cmd="justifyCenter">≡</button><button data-cmd="justifyRight">☷</button><button data-cmd="insertUnorderedList">• Lista</button><button data-cmd="insertOrderedList">1. Lista</button></section>
<section id="sheetTools" class="tools hidden"><strong id="cellName">A1</strong><b style="font-style:italic;color:#64748b">fx</b><input id="formula" placeholder="Ex.: =SOMA(A1:A5), =MÉDIA(A1:A5)"><button id="addRow">＋ Linha</button><button id="addCol">＋ Coluna</button></section>
<main id="docs" class="docs"><article id="editor" class="paper" contenteditable="true" spellcheck="true"><h1>Documento sem título</h1><p>Comece a escrever aqui...</p></article><div class="status"><span id="words">4 palavras</span> · WDM Docs</div></main>
<main id="sheets" class="hidden"><div class="sheetwrap"><table id="grid"></table></div><div class="status">WDM Planilhas · Fórmulas por digitação</div></main>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let app=new URLSearchParams(location.search).get('app')==='sheets'?'sheets':'docs',rows=30,cols=12,selected='A1';const cells=new Map();let timer;const key=a=>'wdm-office-'+a+'-v2';function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(x.t);x.t=setTimeout(()=>x.classList.remove('show'),1500)}function dirty(){$('#saveState').textContent='Alterações não salvas';clearTimeout(timer);timer=setTimeout(save,700)}function switchApp(a){app=a;$('#docs').classList.toggle('hidden',a!=='docs');$('#docTools').classList.toggle('hidden',a!=='docs');$('#sheets').classList.toggle('hidden',a!=='sheets');$('#sheetTools').classList.toggle('hidden',a!=='sheets');$('#tabDocs').classList.toggle('active',a==='docs');$('#tabSheets').classList.toggle('active',a==='sheets');$('#subtitle').textContent=a==='docs'?'Docs':'Planilhas';$('#name').value=localStorage.getItem(key(a)+'-name')||(a==='docs'?'Documento sem título':'Planilha sem título');$('#file').accept=a==='docs'?'.txt,.html,.htm,.doc,.docx':'.csv,.xlsx,.xls';history.replaceState(null,'','?app='+a);load()}
$('#tabDocs').onclick=()=>switchApp('docs');$('#tabSheets').onclick=()=>switchApp('sheets');$$('[data-cmd]').forEach(b=>b.onclick=()=>{editor.focus();document.execCommand(b.dataset.cmd,false,null);dirty()});font.onchange=e=>{editor.focus();document.execCommand('fontName',false,e.target.value);dirty()};size.onchange=e=>{editor.focus();document.execCommand('fontSize',false,e.target.value);dirty()};color.oninput=e=>{editor.focus();document.execCommand('foreColor',false,e.target.value);dirty()};editor.oninput=()=>{wordCount();dirty()};function wordCount(){const t=editor.innerText.trim(),n=t?t.split(/\s+/).length:0;words.textContent=n+' '+(n===1?'palavra':'palavras')}
function col(n){let s='';while(n>=0){s=String.fromCharCode(n%26+65)+s;n=Math.floor(n/26)-1}return s}function parts(a){const m=/^([A-Z]+)(\d+)$/.exec(a);if(!m)return null;let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return{c:c-1,r:+m[2]}}function raw(a){return String(cells.get(a)??'')}function num(a,seen=new Set()){const v=raw(a);if(!v.startsWith('=')){const n=Number(v.replace(',','.'));return Number.isFinite(n)?n:0}return evalFormula(v,new Set([...seen,a]))}function range(a,b,seen){const p=parts(a),q=parts(b),o=[];if(!p||!q)return o;for(let r=Math.min(p.r,q.r);r<=Math.max(p.r,q.r);r++)for(let c=Math.min(p.c,q.c);c<=Math.max(p.c,q.c);c++)o.push(num(col(c)+r,seen));return o}function evalFormula(v,seen=new Set()){try{let e=v.slice(1).trim().toUpperCase().replace(/SOMA/g,'SUM').replace(/M[ÉE]DIA/g,'AVERAGE').replace(/M[ÍI]NIMO/g,'MIN').replace(/M[ÁA]XIMO/g,'MAX');e=e.replace(/(SUM|AVERAGE|MIN|MAX)\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(_,f,a,b)=>{const x=range(a,b,seen);if(!x.length)return'0';if(f==='SUM')return String(x.reduce((a,b)=>a+b,0));if(f==='AVERAGE')return String(x.reduce((a,b)=>a+b,0)/x.length);if(f==='MIN')return String(Math.min(...x));return String(Math.max(...x))});e=e.replace(/\b([A-Z]+\d+)\b/g,(_,a)=>{if(seen.has(a))throw Error();return String(num(a,seen))});if(!/^[0-9+\-*/().\s]+$/.test(e))throw Error();const r=Function('"use strict";return ('+e+')')();return Number.isFinite(r)?r:'#ERRO!'}catch{return'#ERRO!'}}function display(a){const v=raw(a);return v.startsWith('=')?String(evalFormula(v,new Set([a]))):v}
function build(){grid.innerHTML='';const tr=document.createElement('tr');const cc=document.createElement('th');cc.className='corner';tr.appendChild(cc);for(let c=0;c<cols;c++){const th=document.createElement('th');th.className='col';th.textContent=col(c);tr.appendChild(th)}grid.appendChild(tr);for(let r=1;r<=rows;r++){const row=document.createElement('tr');const h=document.createElement('th');h.className='row';h.textContent=r;row.appendChild(h);for(let c=0;c<cols;c++){const a=col(c)+r,td=document.createElement('td'),i=document.createElement('input');td.dataset.cell=a;i.dataset.cell=a;i.value=display(a);i.onfocus=()=>select(a);i.oninput=()=>{cells.set(a,i.value);formula.value=i.value;dirty()};i.onblur=()=>{cells.set(a,i.value);recalc()};i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const p=parts(a);select(col(p.c)+Math.min(rows,p.r+1),true)}};td.appendChild(i);row.appendChild(td)}grid.appendChild(row)}select(selected,false);recalc()}function select(a,focus=false){selected=a;$$('td.sel').forEach(x=>x.classList.remove('sel'));const td=grid.querySelector('td[data-cell="'+a+'"]');if(!td)return;td.classList.add('sel');cellName.textContent=a;formula.value=raw(a);if(focus)td.querySelector('input').focus()}function recalc(){$$('#grid td[data-cell]').forEach(td=>{const a=td.dataset.cell,i=td.querySelector('input');if(document.activeElement!==i)i.value=display(a)})}formula.oninput=()=>{cells.set(selected,formula.value);const i=grid.querySelector('input[data-cell="'+selected+'"]');if(i)i.value=formula.value;dirty()};formula.onkeydown=e=>{if(e.key==='Enter'){cells.set(selected,formula.value);recalc();select(selected,true)}};addRow.onclick=()=>{rows+=5;build();dirty()};addCol.onclick=()=>{cols+=3;build();dirty()};
function save(){if(app==='docs')localStorage.setItem(key('docs'),editor.innerHTML);else localStorage.setItem(key('sheets'),JSON.stringify({rows,cols,cells:[...cells]}));localStorage.setItem(key(app)+'-name',name.value);saveState.textContent='Salvo neste navegador'}function load(){if(app==='docs'){const d=localStorage.getItem(key('docs'));if(d)editor.innerHTML=d;wordCount()}else{const d=localStorage.getItem(key('sheets'));if(d)try{const x=JSON.parse(d);rows=x.rows||30;cols=x.cols||12;cells.clear();(x.cells||[]).forEach(([k,v])=>cells.set(k,v))}catch{}build()}saveState.textContent='Salvo neste navegador'}saveBtn.onclick=()=>{save();toast('Salvo')};name.oninput=dirty;newBtn.onclick=()=>{if(app==='docs'){editor.innerHTML='<h1>Documento sem título</h1><p>Comece a escrever aqui...</p>';name.value='Documento sem título';wordCount()}else{cells.clear();rows=30;cols=12;name.value='Planilha sem título';build()}dirty()};openBtn.onclick=()=>file.click();file.onchange=async()=>{const f=file.files[0];if(!f)return;name.value=f.name.replace(/\.[^.]+$/,'');if(app==='docs'){const t=await f.text();editor.innerHTML=/\.html?$/i.test(f.name)?t:'<p>'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'</p><p>')+'</p>';wordCount()}else if(/\.csv$/i.test(f.name)){cells.clear();const lines=(await f.text()).replace(/^\ufeff/,'').split(/\r?\n/),del=lines.some(x=>x.includes(';'))?';':',';lines.forEach((ln,r)=>ln.split(del).forEach((v,c)=>{if(v)cells.set(col(c)+(r+1),v.replace(/^"|"$/g,''))}));build()}else if(window.XLSX){cells.clear();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],m=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});m.forEach((rr,r)=>rr.forEach((v,c)=>{if(v!=='')cells.set(col(c)+(r+1),String(v))}));build()}save();file.value=''};downloadBtn.onclick=()=>{const safe=(name.value||'arquivo').replace(/[\\/:*?"<>|]+/g,'-');if(app==='docs'){const blob=new Blob(['\ufeff<!doctype html><meta charset="utf-8"><body>'+editor.innerHTML+'</body>'],{type:'application/msword'});dl(blob,safe+'.doc')}else if(window.XLSX){const m=[];for(let r=1;r<=rows;r++){const rr=[];for(let c=0;c<cols;c++)rr.push(raw(col(c)+r));m.push(rr)}const ws=XLSX.utils.aoa_to_sheet(m),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Planilha1');XLSX.writeFile(wb,safe+'.xlsx')}};function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}switchApp(app)})();
</script>
</body>
</html>
