<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#107c41">
<title>WDM Planilhas</title>
<link rel="stylesheet" href="sheets.css?v=20260909-2">
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="mark">X</div><div><small>WDM OFFICE</small><strong>WDM Planilhas</strong></div></div><div class="titlebox"><input id="bookName" value="Pasta de trabalho sem título" maxlength="90"></div><div id="saveState" class="save-state">Nova pasta de trabalho</div></header>
<section class="filebar"><button id="newBook">＋ Novo</button><button id="openSaved">📂 Abrir do navegador</button><button id="openFile">🗂 Abrir Excel/CSV</button><button id="saveBrowser" class="primary">💾 Salvar no navegador</button><span class="sep"></span><button id="exportXlsx">⬇ Salvar .xlsx</button><input id="fileInput" type="file" accept=".xlsx,.xls,.csv" hidden></section>
<nav class="ribbon-tabs"><button class="active" data-tab="home">Início</button><button data-tab="data">Dados</button></nav>
<section class="toolbar">
<div class="panel" data-panel="home">
<div class="group" data-label="Desfazer"><button id="undoBtn">↶</button><button id="redoBtn">↷</button></div>
<div class="group" data-label="Fonte"><select id="fontFamily" class="select font"><option>Calibri</option><option>Arial</option><option>Segoe UI</option><option>Georgia</option><option>Times New Roman</option><option>Verdana</option></select><select id="fontSize" class="select size"><option>10</option><option selected>11</option><option>12</option><option>14</option><option>16</option><option>18</option><option>24</option></select><button id="boldBtn"><b>N</b></button><button id="italicBtn"><i>I</i></button><button id="underlineBtn"><u>S</u></button><div class="colorwrap"><span>A</span><input id="fontColor" type="color" value="#202622" title="Cor da fonte"></div><div class="colorwrap"><span>▰</span><input id="fillColor" type="color" value="#ffffff" title="Cor da célula"></div></div>
<div class="group" data-label="Alinhamento"><button data-align="left">⬅</button><button data-align="center">↔</button><button data-align="right">➡</button></div>
<div class="group" data-label="Número"><button id="currencyBtn">R$</button><button id="percentBtn">%</button><button id="numberBtn">123</button><button id="decDown">.0←</button><button id="decUp">.00→</button></div>
<div class="group" data-label="Limpar"><button id="clearFormat">Limpar formato</button></div>
</div>
<div class="panel hidden" data-panel="data"><div class="group" data-label="Estrutura"><button id="addRowBtn">＋ Linha</button><button id="addColBtn">＋ Coluna</button><button id="freezeBtn">❄ Cabeçalhos: ON</button></div><div class="group" data-label="Fórmulas"><button class="formula-example" data-formula="=SOMA(A1:A10)">SOMA</button><button class="formula-example" data-formula="=MÉDIA(A1:A10)">MÉDIA</button><button class="formula-example" data-formula="=SE(A1&gt;10;&quot;Sim&quot;;&quot;Não&quot;)">SE</button><button class="formula-example" data-formula="=CONT.SE(A1:A10;&quot;&gt;0&quot;)">CONT.SE</button><button class="formula-example" data-formula="=SOMASE(A1:A10;&quot;&gt;0&quot;;B1:B10)">SOMASE</button></div></div>
</section>
<section class="formula-row"><input id="nameBox" class="namebox" value="A1"><div class="fx">fx</div><input id="formulaInput" class="formula" placeholder="Digite um valor ou fórmula, ex.: =SOMA(A1:A10)"></section>
<div id="gridWrap" class="grid-wrap"><table id="grid" class="grid"></table></div>
<footer id="sheetBar" class="sheetbar"><button id="addSheet" class="add-sheet" title="Nova planilha">＋</button></footer>
<footer class="statusbar"><span id="statusLeft">Pronto</span><span id="statusRight">A1</span></footer>
</div>
<div id="context" class="context"><button data-act="insertRowAbove">Inserir linha acima</button><button data-act="insertRowBelow">Inserir linha abaixo</button><button data-act="deleteRow">Excluir linha</button><hr><button data-act="insertColLeft">Inserir coluna à esquerda</button><button data-act="insertColRight">Inserir coluna à direita</button><button data-act="deleteCol">Excluir coluna</button><hr><button data-act="clearCell">Limpar conteúdo</button></div>
<div id="savedModal" class="modal-backdrop"><section class="modal"><div class="modal-head"><h2>Pastas salvas neste navegador</h2><button id="closeModal">×</button></div><div id="savedList" class="saved-list"></div></section></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="sheets.js?v=20260909-2"></script>
</body>
</html>
