<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>WDM Shopping</title><style>
:root{--bg:#050914;--s:#0b1628;--s2:#101e34;--line:#1d3150;--text:#f7fbff;--muted:#95a7c2;--blue:#2f7df6;--cyan:#35c9ff;--green:#2fc884;--red:#fb7185}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 70% -10%,#173563 0,transparent 26%),var(--bg);color:var(--text);font:15px Inter,system-ui,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.shell{width:min(1160px,calc(100% - 32px));margin:auto}.top{height:72px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:25px;padding:0 max(16px,calc((100vw - 1160px)/2));background:#050914e8;border-bottom:1px solid #ffffff0d;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 10px 28px #2f7df655}.brand span{display:grid;line-height:1}.brand small{color:var(--muted);font-weight:600}.nav{margin-left:auto;display:flex;align-items:center;gap:22px;color:#c9d5e7}.nav a:hover{color:#fff}.btn,.btn2{border:0;border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:800}.btn{background:linear-gradient(135deg,var(--blue),#4969ff);color:#fff}.btn2{background:#0b182b;color:#d9e8fa;border:1px solid var(--line)}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:30px;align-items:center;padding:78px 0 42px}.ey{color:#73baff;text-transform:uppercase;font-size:.74rem;font-weight:900;letter-spacing:.14em}.hero h1{font-size:clamp(2.7rem,6vw,5.4rem);line-height:.95;letter-spacing:-.06em;margin:14px 0 20px}.hero h1 em{font-style:normal;background:linear-gradient(90deg,#74baff,#67e2ff);color:transparent;background-clip:text}.hero p,.muted{color:var(--muted);line-height:1.65}.search{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px;background:#0b1729;border:1px solid var(--line);border-radius:16px;margin-top:26px}.search input{border:0;outline:0;background:transparent;color:#fff;padding:10px}.heroCard,.card,.panel,.auth{background:linear-gradient(160deg,#0d1c32,#081221);border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 65px #0005}.heroCard{padding:26px}.heroCard .fakeLogo{width:74px;height:74px;margin:35px 0 18px;border-radius:20px;background:#fff;color:#0a1730;display:grid;place-items:center;font-size:1.4rem;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:17px;overflow:hidden}.stats div{padding:18px;background:#081221}.stats strong,.stats span{display:block}.stats span{color:var(--muted);font-size:.8rem;margin-top:4px}.section{padding:62px 0}.section h2{font-size:2rem;margin:7px 0 22px}.chips{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.chip{white-space:nowrap;border:1px solid var(--line);background:#091526;color:#b9c8da;border-radius:999px;padding:9px 13px;cursor:pointer}.chip.on{background:#173f76;color:#fff;border-color:#317cf2}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{overflow:hidden}.cover{height:115px;padding:15px;background:linear-gradient(135deg,#22508c,#10203a)}.badge{font-size:.7rem;padding:6px 9px;border-radius:999px;background:#06101dcc}.body{padding:17px}.storeline{display:flex;align-items:center;gap:11px;margin-top:-43px}.avatar{width:55px;height:55px;border:4px solid #091321;border-radius:16px;background:#fff;color:#071324;display:grid;place-items:center;font-weight:900}.body h3{margin:0}.body p{min-height:50px;color:var(--muted);font-size:.86rem;line-height:1.45}.meta{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}.meta a{color:#78c0ff;font-weight:800}.services{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.service{padding:18px;border:1px solid var(--line);border-radius:17px;background:#091422}.service b{display:block;margin:8px 0}.service span{color:var(--muted);font-size:.83rem}.authWrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:35px 16px}.auth{width:min(620px,100%);padding:26px}.auth h1{margin:8px 0 4px}.form{display:grid;gap:12px;margin-top:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:.77rem;color:#b8c7da;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#07111f;color:#fff;border-radius:11px;padding:11px;outline:none}.field textarea{min-height:85px;resize:vertical}.status{min-height:20px;color:#75dfb3;font-weight:700}.err{color:#ff9ea9}.panelWrap{width:min(1160px,calc(100% - 32px));margin:34px auto;display:grid;grid-template-columns:250px 1fr;gap:18px}.side{position:sticky;top:90px;align-self:start;border:1px solid var(--line);border-radius:20px;background:#081221;padding:18px}.side nav{display:grid;gap:7px;margin-top:22px}.side a,.side button{padding:11px;border-radius:10px;background:transparent;color:#cbd9e9;border:0;text-align:left;cursor:pointer}.side a:hover,.side button:hover{background:#11223a}.panel{padding:22px}.panel h1{margin:5px 0 20px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.products{display:grid;gap:10px;margin-top:16px}.prod{display:grid;grid-template-columns:1fr auto;gap:12px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#07111f}.prod b{display:block}.price{color:#8ad9ff;font-weight:900}.old{color:#71839a;text-decoration:line-through;font-size:.8rem;margin-right:7px}.prodBtns{display:flex;gap:6px;align-items:center}.mini{border:1px solid var(--line);background:#0c1a2c;color:#c7d8e9;border-radius:9px;padding:7px 9px;cursor:pointer}.danger{color:#ff9fa9;border-color:#55333a}.storeHero{padding:45px 0 15px}.banner{height:210px;border-radius:24px;background:linear-gradient(135deg,var(--store,#2f7df6),#10203a);border:1px solid var(--line)}.profile{display:flex;align-items:end;gap:16px;margin:-45px 24px 0;position:relative}.big{width:90px;height:90px;border:6px solid var(--bg);border-radius:22px;background:#fff;color:#071324;display:grid;place-items:center;font-size:1.4rem;font-weight:900}.profile .actions{margin-left:auto}.promo{margin:24px 0;padding:14px 16px;border:1px solid #5b4d20;background:#fbbf2410;color:#f3d67c;border-radius:14px}.productGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{border:1px solid var(--line);border-radius:16px;background:#091422;padding:16px}.product h3{margin:0 0 8px}.wa{display:block;margin-top:12px;text-align:center;padding:9px;border-radius:10px;background:#16a46622;border:1px solid #178e61;color:#75e1b3;font-weight:900}.note{padding:11px 13px;border:1px dashed #35516f;border-radius:12px;color:#8fa2bb;font-size:.8rem;margin-top:14px}.hide{display:none!important}.footer{padding:38px 0;color:#72839c;text-align:center}.mobile{display:none}

</style></head><body><header class="top"><a class="brand" href="#home"><span class="logo">W</span><span>WDM<small>Shopping</small></span></a><nav class="nav"><a href="#home">Início</a><a href="#home-lojas">Lojas</a><a href="#home-servicos">Serviços</a><a id="accountTop" class="btn2" href="#login">Área do lojista</a><a href="../">WDM Apps</a></nav></header><main id="app"></main><nav class="mobile"><a href="#home">⌂ Início</a><a href="#home-lojas">▦ Lojas</a><a href="#home-servicos">⚒ Serviços</a><a id="accountMobile" href="#login">⚙ Lojista</a></nav><script>
const K={users:'wdmShoppingUsersV2',stores:'wdmShoppingStoresV2',session:'wdmShoppingSessionV2',products:'wdmShoppingProductsV1'};const R=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}},W=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),D=v=>String(v??'').replace(/\D/g,''),E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function phone(v){let d=D(v);if(d.length>11&&d.startsWith('55'))d=d.slice(2);d=d.slice(0,11);if(!d)return'';if(d.length<=2)return`(${d}`;let a=d.slice(0,2),r=d.slice(2);if(d.length<=10)return`(${a}) ${r.slice(0,4)}${r.length>4?'-'+r.slice(4,8):''}`;return`(${a}) ${r.slice(0,1)}${r.length>1?' '+r.slice(1,5):''}${r.length>5?'-'+r.slice(5,9):''}`}
function wd(v){let d=D(v);if(d.length>11&&d.startsWith('55'))d=d.slice(2);return d.length>=10?'55'+d:d}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function pm(v){let d=D(v);return d?Number(d)/100:0}function slug(v){return String(v||'loja').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'loja'}function current(){let s=R(K.session,null);return s?R(K.users,[]).find(u=>u.id===s.userId)||null:null}function cstore(){let u=current();return u?R(K.stores,[]).find(s=>s.ownerId===u.id)||null:null}function products(id,all=false){return R(K.products,[]).filter(p=>p.storeId===id&&(all||p.active!==false)).sort((a,b)=>Number(b.featured)-Number(a.featured))}
const samples=[['techmix','TechMix Informática','Tecnologia','TM','#20509a','Computadores, acessórios e manutenção.'],['casabela','Casa Bela','Casa','CB','#805234','Utilidades e decoração para sua casa.'],['sabordavila','Sabor da Vila','Alimentação','SV','#8a392f','Lanches, porções e combos preparados na hora.'],['urbanstyle','Urban Style','Moda','US','#4c3f82','Moda casual, acessórios e lançamentos.'],['studio47','Studio 47','Beleza','47','#316057','Cabelo, barba e estética com agendamento.'],['reparafacil','Repara Fácil','Serviços','RF','#73541f','Reparos, elétrica e manutenção residencial.']];const svc=[['⚡','Eletricista'],['🎨','Pintor'],['🔧','Técnico de informática'],['🧱','Pedreiro']];
function navAccount(){let u=current();for(let id of['accountTop','accountMobile']){let a=document.getElementById(id);if(a){a.href=u?'#painel':'#login';a.textContent=u?(id==='accountTop'?'Meu painel':'⚙ Painel'):(id==='accountTop'?'Área do lojista':'⚙ Lojista')}}}
function home(anchor=''){let custom=R(K.stores,[]).filter(s=>s.published!==false).map(s=>[s.id,s.name,s.category,s.initials,s.primary,s.description]);let stores=[...custom,...samples.filter(x=>!custom.some(c=>c[0]===x[0]))];app.innerHTML=`<section class="shell hero"><div><span class="ey">O comércio da sua cidade, conectado</span><h1>Encontre lojas, ofertas e profissionais <em>perto de você.</em></h1><p>Uma vitrine digital simples para quem compra e uma loja fácil de administrar para quem vende.</p><div class="search"><input id="q" placeholder="Buscar loja, produto ou serviço..."><button class="btn" id="go">Buscar</button></div><p><a class="btn" href="#cadastro">Quero minha loja</a></p></div><aside class="heroCard"><span class="ey">Destaque local</span><div class="fakeLogo">WS</div><h2>Sua loja pode estar aqui</h2><p>Cadastre produtos, promoções e receba pedidos direto no WhatsApp.</p></aside></section><section class="shell stats"><div><strong>24h</strong><span>vitrine disponível</span></div><div><strong>0%</strong><span>comissão nas vendas</span></div><div><strong>PWA</strong><span>pronto para evoluir</span></div><div><strong>Local</strong><span>feito para a cidade</span></div></section><section id="home-lojas" class="shell section"><span class="ey">Vitrines locais</span><h2>Lojas em destaque</h2><div id="storeGrid" class="grid"></div></section><section id="home-servicos" class="shell section"><span class="ey">Profissionais</span><h2>Prestadores de serviços</h2><div class="services">${svc.map(x=>`<div class="service"><span style="font-size:1.5rem">${x[0]}</span><b>${x[1]}</b><span>Encontre profissionais e peça orçamento diretamente.</span></div>`).join('')}</div></section><footer class="shell footer">WDM Shopping · versão de teste da WDM Apps</footer>`;let draw=()=>{let q=(document.getElementById('q').value||'').toLowerCase();storeGrid.innerHTML=stores.filter(s=>`${s[1]} ${s[2]} ${s[5]}`.toLowerCase().includes(q)).map(s=>`<article class="card"><div class="cover" style="background:linear-gradient(135deg,${E(s[4])},#10203a)"><span class="badge">Loja local</span></div><div class="body"><div class="storeline"><div class="avatar">${E(s[3])}</div><div><h3>${E(s[1])}</h3><span class="muted">${E(s[2])}</span></div></div><p>${E(s[5])}</p><div class="meta"><span>★ destaque</span><a href="#loja/${encodeURIComponent(s[0])}">Ver loja →</a></div></div></article>`).join('')};draw();q.oninput=draw;go.onclick=draw;if(anchor)setTimeout(()=>document.getElementById(anchor)?.scrollIntoView(),0)}
function auth(type){let reg=type==='cadastro';app.innerHTML=`<div class="authWrap"><section class="auth"><span class="ey">${reg?'Cadastro do lojista':'Área do lojista'}</span><h1>${reg?'Abrir minha loja':'Entrar no painel'}</h1><p class="muted">${reg?'Crie sua conta e a primeira vitrine do seu negócio.':'Acesse a loja que você já cadastrou neste navegador.'}</p><form id="authForm" class="form">${reg?`<div class="two"><div class="field"><label>Seu nome</label><input name="name" required></div><div class="field"><label>Nome do negócio</label><input name="business" required></div></div>`:''}<div class="two"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha</label><input name="password" type="password" minlength="6" required></div></div>${reg?`<div class="two"><div class="field"><label>Categoria</label><select name="category"><option>Tecnologia</option><option>Alimentação</option><option>Casa</option><option>Moda</option><option>Beleza</option><option>Serviços</option><option>Outros</option></select></div><div class="field"><label>WhatsApp</label><input id="authPhone" name="phone" inputmode="tel" placeholder="(11) 9 9999-9999"></div></div>`:''}<div id="st" class="status"></div><button class="btn" type="submit">${reg?'Criar conta e loja':'Entrar'}</button></form><p class="muted">${reg?'Já tem cadastro? <a href="#login">Entrar</a>':'Ainda não tem loja? <a href="#cadastro">Cadastrar</a>'}</p><div class="note">Teste online: os dados ainda ficam somente neste navegador. O Firebase será a próxima ligação.</div></section></div>`;if(reg)authPhone.oninput=e=>e.target.value=phone(e.target.value);authForm.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),users=R(K.users,[]),stores=R(K.stores,[]),email=String(f.get('email')).trim().toLowerCase(),pass=String(f.get('password'));try{if(reg){if(users.some(u=>u.email===email))throw Error('Este e-mail já está cadastrado.');let id='u'+Date.now(),u={id,name:String(f.get('name')).trim(),email,password:pass};let sid=slug(f.get('business')),base=sid,n=2;while(stores.some(s=>s.id===sid))sid=base+'-'+n++;users.push(u);stores.push({id:sid,ownerId:id,name:String(f.get('business')).trim(),category:String(f.get('category')),initials:String(f.get('business')).trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase(),primary:'#2f7df6',description:'Bem-vindo à nossa vitrine no WDM Shopping.',whatsapp:wd(f.get('phone')),promo:'Confira nossas novidades!',published:true});W(K.users,users);W(K.stores,stores);W(K.session,{userId:id})}else{let u=users.find(u=>u.email===email&&u.password===pass);if(!u)throw Error('E-mail ou senha inválidos.');W(K.session,{userId:u.id})}location.hash='#painel'}catch(err){st.className='status err';st.textContent=err.message}}}
function panel(){let u=current(),s=cstore();if(!u||!s){location.hash='#login';return}let ps=products(s.id,true);app.innerHTML=`<div class="panelWrap"><aside class="side"><div class="brand"><span class="logo">W</span><span>WDM<small>Shopping</small></span></div><nav><a href="#painel">Minha loja</a><a href="#loja/${encodeURIComponent(s.id)}">Ver vitrine</a><a href="#home">Voltar ao Shopping</a><button id="logout">Sair</button></nav></aside><section><div class="panel"><span class="ey">Área do lojista</span><div class="row"><h1>Gerencie sua loja</h1><a class="btn2" href="#loja/${encodeURIComponent(s.id)}">Abrir vitrine →</a></div><form id="storeForm" class="form"><div class="two"><div class="field"><label>Nome da loja</label><input name="name" value="${E(s.name)}" required></div><div class="field"><label>Categoria</label><select name="category">${['Tecnologia','Alimentação','Casa','Moda','Beleza','Serviços','Outros'].map(x=>`<option ${x===s.category?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="two"><div class="field"><label>WhatsApp</label><input id="phone" name="phone" value="${E(phone(s.whatsapp))}"></div><div class="field"><label>Cor principal</label><input name="primary" type="color" value="${E(s.primary||'#2f7df6')}"></div></div><div class="field"><label>Descrição</label><textarea name="description">${E(s.description||'')}</textarea></div><div class="field"><label>Promoção em destaque</label><textarea name="promo">${E(s.promo||'')}</textarea></div><label><input name="published" type="checkbox" ${s.published!==false?'checked':''}> Loja publicada</label><div id="saveSt" class="status"></div><button class="btn" type="submit">Salvar alterações</button></form></div><div class="panel" style="margin-top:18px"><div class="row"><div><span class="ey">Catálogo</span><h2>Produtos</h2></div><span class="muted">${ps.length} cadastrado(s)</span></div><form id="prodForm" class="form"><input name="id" type="hidden"><div class="two"><div class="field"><label>Produto</label><input name="name" required placeholder="Ex.: Notebook Dell"></div><div class="field"><label>Preço</label><input id="price" name="price" inputmode="numeric" required placeholder="R$ 0,00"></div></div><div class="two"><div class="field"><label>Preço anterior</label><input id="oldPrice" name="oldPrice" inputmode="numeric" placeholder="R$ 0,00"></div><div class="field"><label>Descrição</label><input name="description"></div></div><label><input name="featured" type="checkbox"> Destacar produto</label><label><input name="active" type="checkbox" checked> Produto visível</label><div id="prodSt" class="status"></div><button class="btn" type="submit">Salvar produto</button></form><div id="plist" class="products"></div></div></section></div>`;phone.oninput=e=>e.target.value=window.phone(e.target.value);for(let el of[price,oldPrice])el.oninput=e=>e.target.value=D(e.target.value)?money(pm(e.target.value)):'';logout.onclick=()=>{localStorage.removeItem(K.session);location.hash='#home'};storeForm.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),ss=R(K.stores,[]),i=ss.findIndex(x=>x.id===s.id);ss[i]={...ss[i],name:String(f.get('name')).trim(),category:String(f.get('category')),whatsapp:wd(f.get('phone')),primary:String(f.get('primary')),description:String(f.get('description')).trim(),promo:String(f.get('promo')).trim(),published:f.get('published')==='on'};W(K.stores,ss);saveSt.textContent='Loja salva';setTimeout(()=>saveSt.textContent='',1800)};prodForm.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),all=R(K.products,[]),id=String(f.get('id')||''),i=all.findIndex(p=>p.id===id&&p.storeId===s.id),p={id:i>=0?id:'p'+Date.now(),storeId:s.id,name:String(f.get('name')).trim(),price:pm(f.get('price')),oldPrice:pm(f.get('oldPrice')),description:String(f.get('description')).trim(),featured:f.get('featured')==='on',active:f.get('active')==='on'};if(!p.name||p.price<=0){prodSt.className='status err';prodSt.textContent='Informe nome e preço maior que
