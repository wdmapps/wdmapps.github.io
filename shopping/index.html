<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <meta name="description" content="WDM Shopping — lojas, produtos e serviços locais em uma vitrine digital.">
  <title>WDM Shopping</title>
  <link rel="stylesheet" href="shopping.css">
  <link rel="stylesheet" href="shopping-products.css?v=20260817-10">
  <style>
    .freeTrialBanner{max-width:1180px;margin:18px auto 0;padding:0 18px}
    .freeTrialBanner[hidden]{display:none}
    .freeTrialInner{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 18px;border:1px solid #315c92;border-radius:18px;background:linear-gradient(135deg,#0b203a,#102d50);box-shadow:0 14px 34px #0004;color:#dcecff}
    .freeTrialInner strong{display:block;color:#fff;font-size:1.08rem;margin-bottom:3px}
    .freeTrialInner span{color:#b8cee8;font-size:.9rem;line-height:1.45}
    .freeTrialInner .btn{white-space:nowrap;text-decoration:none}
    @media(max-width:680px){.freeTrialInner{align-items:stretch;flex-direction:column}.freeTrialInner .btn{width:100%;text-align:center}}
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="#home"><span class="logo">W</span><span>WDM<small>Shopping</small></span></a>
    <nav class="nav">
      <a href="#home">Início</a>
      <a href="#home-anuncios">Anúncios</a>
      <a href="#home-lojas">Lojas</a>
      <a href="#home-servicos">Serviços</a>
      <a href="#adultos">18+</a>
      <a href="suporte.html">Suporte</a>
      <a id="accountTop" class="btn2" href="#login">Entrar / Cadastrar</a>
      <a href="../">WDM Apps</a>
    </nav>
  </header>

  <section id="freeTrialBanner" class="freeTrialBanner" aria-label="Teste grátis do WDM Shopping">
    <div class="freeTrialInner">
      <div>
        <strong>🎁 Experimente o WDM Shopping por 5 dias grátis</strong>
        <span>Crie sua loja ou perfil profissional sem cartão para começar. Depois do teste, continue por R$ 29,90/mês se quiser.</span>
      </div>
      <a class="btn" href="#cadastro">Começar grátis</a>
    </div>
  </section>

  <main id="app"></main>
  <nav class="mobile">
    <a href="#home">⌂ Início</a>
    <a href="#home-lojas">▦ Lojas</a>
    <a href="#home-servicos">⚒ Serviços</a>
    <a id="accountMobile" href="#login">⚙ Entrar</a>
  </nav>

  <script>
    (() => {
      const banner = document.getElementById('freeTrialBanner');
      const sync = () => {
        const hash = location.hash || '#home';
        banner.hidden = !(hash === '#home' || hash.startsWith('#home-'));
      };
      window.addEventListener('hashchange', sync);
      sync();
    })();
  </script>
  <script type="module" src="shopping-app.js?v=20260817-12"></script>
  <script type="module" src="google-login.js?v=20260817-1"></script>
  <script type="module" src="subscription-gate.js?v=20260818-4"></script>
  <script type="module" src="trial-ui.js?v=20260818-1"></script>
  <script type="module" src="extra-store-categories.js?v=20260902-1"></script>
  <script src="admin-free-link.js?v=20260902-1" defer></script>
</body>
</html>
