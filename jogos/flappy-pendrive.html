<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Pendrive - Memória RAM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #2c3e50;
    user-select: none;
    -webkit-user-select: none;
  }
  #game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(#1a2533, #0f1620);
  }
  canvas {
    display: block;
    background: #0a1f0d;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    image-rendering: crisp-edges;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    margin: auto;
    width: min(100vw, 480px);
    height: min(100vh, 720px);
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    color: #fff;
    text-align: center;
    flex-direction: column;
  }
  .panel {
    pointer-events: auto;
    background: rgba(15, 22, 32, 0.94);
    padding: 28px 36px;
    border-radius: 16px;
    border: 2px solid #00e0c6;
    box-shadow: 0 0 30px rgba(0,224,198,0.4);
    max-width: 360px;
  }
  h1 {
    font-size: 26px;
    margin-bottom: 6px;
    background: linear-gradient(#00e0c6, #4ca1e0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { font-size: 13px; color: #9bb; margin-bottom: 18px; }
  .btn {
    background: linear-gradient(#00e0c6, #00b894);
    color: #06231f;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
    transition: transform .1s ease, box-shadow .1s ease;
    box-shadow: 0 4px 0 #008f6b;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #008f6b; }
  .hint { font-size: 12px; color: #789; margin-top: 14px; line-height: 1.6; }
  #score-display {
    position: absolute;
    top: 16px;
    left: 0; right: 0;
    text-align: center;
    font-size: 48px;
    font-weight: 900;
    color: #fff;
    text-shadow: 2px 2px 0 #0a3550, 3px 3px 6px rgba(0,0,0,0.5);
    display: none;
    transition: transform .1s ease;
  }
  #score-display.pop { transform: scale(1.25); }
  .hidden { display: none !important; }
  .best { font-size: 14px; color: #ffd56b; margin-top: 10px; font-weight: 600; }
  .row { display: flex; justify-content: space-around; width: 100%; margin-top: 8px; font-size: 14px; color: #cde; }
  #mute-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(15, 22, 32, 0.85);
    border: 2px solid #00e0c6;
    color: #00e0c6;
    font-size: 18px;
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  #mute-btn:active { transform: scale(0.92); }
  .medal {
    font-size: 44px;
    margin: 6px 0 4px;
    line-height: 1;
  }
  .medal-name { font-size: 13px; color: #ffd56b; font-weight: 700; margin-bottom: 6px; }

  /* ---------- Splash WDM Games ---------- */
  #splash {
    position: absolute; inset: 0; margin: auto;
    width: min(100vw, 480px); height: min(100vh, 720px);
    display: flex; justify-content: center; align-items: center; flex-direction: column;
    background: #050a0f; z-index: 30; cursor: pointer;
    animation: splashFade 0.6s ease;
  }
  #splash .wdm {
    font-size: 52px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(#ff5252, #ff1744, #ff5252);
    background-size: 200% 100%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 2s linear infinite;
    text-shadow: 0 0 30px rgba(255,82,82,0.5);
  }
  #splash .wdm-sub {
    font-size: 14px; color: #445; letter-spacing: 8px;
    margin-top: 10px; text-transform: uppercase;
  }
  #splash .boot {
    margin-top: 30px; font-family: 'Consolas','Courier New',monospace;
    font-size: 11px; color: #00e0c6; text-align: left;
    min-width: 220px; opacity: 0.8; line-height: 1.7;
  }
  #splash .boot .ok { color: #00e676; }
  #splash .tap-hint {
    position: absolute; bottom: 60px; font-size: 12px; color: #445;
    animation: pulseTap 1.2s ease infinite;
  }
  @keyframes shimmer { 0%{background-position:0% 0} 100%{background-position:200% 0} }
  @keyframes splashFade { from{opacity:0} to{opacity:1} }
  @keyframes pulseTap { 0%,100%{opacity:0.3} 50%{opacity:0.9} }
  #splash.out { animation: splashOut 0.5s ease forwards; }
  @keyframes splashOut { to { opacity: 0; visibility: hidden; } }

  /* ---------- Input de nome ---------- */
  .name-field { width: 100%; margin-top: 6px; margin-bottom: 4px; }
  .name-field label {
    display: block; font-size: 11px; color: #789;
    margin-bottom: 4px; letter-spacing: 1px;
  }
  #player-name {
    width: 100%; background: #0a1218; border: 2px solid #2a3a4a;
    color: #00e0c6; font-size: 16px; font-weight: 700;
    padding: 10px 12px; border-radius: 8px; text-align: center;
    letter-spacing: 2px; text-transform: uppercase; outline: none;
    font-family: 'Consolas','Courier New',monospace;
  }
  #player-name:focus { border-color: #00e0c6; box-shadow: 0 0 12px rgba(0,224,198,0.4); }

  /* ---------- Botão secundario ---------- */
  .btn-sec {
    background: transparent; color: #9bb; border: 1.5px solid #3a4a5a;
    padding: 8px 18px; font-size: 13px; font-weight: 600;
    border-radius: 8px; cursor: pointer; margin-top: 10px;
    transition: all .12s ease;
  }
  .btn-sec:hover { border-color: #00e0c6; color: #00e0c6; }
  .btn-sec:active { transform: scale(0.96); }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* ---------- Ranking ---------- */
  #rank-screen .panel, #rank-over .panel { max-width: 320px; width: 100%; }
  .rank-title {
    font-size: 18px; font-weight: 800; color: #00e0c6;
    letter-spacing: 2px; margin-bottom: 10px;
  }
  .rank-list {
    list-style: none; text-align: left;
    max-height: 260px; overflow-y: auto;
    margin: 6px 0 10px; padding: 0 4px;
  }
  .rank-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 10px; margin: 3px 0; border-radius: 7px;
    background: rgba(20,35,50,0.7); border-left: 3px solid #2a3a4a;
    font-size: 14px;
  }
  .rank-list li.me { border-left-color: #ffd56b; background: rgba(60,50,20,0.5); }
  .rank-list li.top1 { border-left-color: #ffd700; background: rgba(60,50,10,0.6); }
  .rank-list li.top2 { border-left-color: #c0c0c0; }
  .rank-list li.top3 { border-left-color: #cd7f32; }
  .rank-list .pos { font-weight: 800; color: #789; width: 28px; }
  .rank-list .pname {
    flex: 1; color: #cde; font-family: 'Consolas',monospace;
    font-weight: 600; letter-spacing: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rank-list .pscore { font-weight: 800; color: #00e0c6; }
  .rank-list .pmedal { margin-left: 6px; }
  .rank-empty { color: #567; font-size: 13px; padding: 12px; text-align: center; }
  .rank-list::-webkit-scrollbar { width: 6px; }
  .rank-list::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 3px; }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>
  <button id="mute-btn" title="Som on/off">♪</button>
  <div id="score-display">0</div>

  <!-- Splash WDM Games -->
  <div id="splash">
    <div class="wdm">WDM GAMES</div>
    <div class="wdm-sub">presents</div>
    <div class="boot" id="boot-log"></div>
    <div class="tap-hint">toque para iniciar</div>
  </div>

  <!-- Tela inicial -->
  <div class="overlay" id="start-screen">
    <div class="panel">
      <h1>FLAPPY PENDRIVE</h1>
      <div class="sub">Desvie dos pentes de memória RAM!</div>
      <div class="name-field">
        <label>SEU NOME</label>
        <input type="text" id="player-name" maxlength="10" placeholder="JOGADOR" autocomplete="off">
      </div>
      <button class="btn" id="start-btn">JOGAR</button>
      <div class="btn-row">
        <button class="btn-sec" id="rank-btn">RANKING</button>
        <button class="btn-sec" id="clear-rank-btn">LIMPAR DADOS</button>
      </div>
      <div class="hint">
        <b>Espaço</b> / <b>Clique</b> / <b>Toque</b> para voar
      </div>
    </div>
  </div>

  <!-- Tela de ranking (a partir do menu) -->
  <div class="overlay hidden" id="rank-screen">
    <div class="panel">
      <div class="rank-title">RANKING</div>
      <ul class="rank-list" id="rank-list"></ul>
      <button class="btn-sec" id="rank-back">VOLTAR</button>
    </div>
  </div>

  <!-- Game Over -->
  <div class="overlay hidden" id="over-screen">
    <div class="panel">
      <h1 style="background:linear-gradient(#ff6b6b,#ff9c6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">VOCÊ PERDEU!</h1>
      <div class="medal" id="medal-icon"></div>
      <div class="medal-name" id="medal-name"></div>
      <div class="row"><div>Jogador: <b id="over-name">-</b></div><div>Pontos: <b id="over-score">0</b></div></div>
      <div class="row"><div>Recorde pessoal: <b id="over-best">0</b></div></div>
      <div class="best hidden" id="new-record">NOVO RECORDE PESSOAL!</div>
      <button class="btn" id="retry-btn">JOGAR DE NOVO</button>
      <div class="btn-row">
        <button class="btn-sec" id="over-rank-btn">VER RANKING</button>
      </div>
    </div>
  </div>

  <!-- Ranking a partir do game over -->
  <div class="overlay hidden" id="rank-over">
    <div class="panel">
      <div class="rank-title">RANKING</div>
      <ul class="rank-list" id="rank-list-over"></ul>
      <button class="btn" id="rank-retry">JOGAR DE NOVO</button>
    </div>
  </div>
</div>
<script>
(function(){
  // ---------- Setup de canvas responsivo ----------
  const wrap = document.getElementById('game-wrap');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('score-display');
  const startScreen = document.getElementById('start-screen');
  const overScreen = document.getElementById('over-screen');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const overScore = document.getElementById('over-score');
  const overBest = document.getElementById('over-best');
  const newRecord = document.getElementById('new-record');
  const medalIcon = document.getElementById('medal-icon');
  const medalName = document.getElementById('medal-name');
  const muteBtn = document.getElementById('mute-btn');

  // Splash / nome / ranking
  const splash = document.getElementById('splash');
  const bootLog = document.getElementById('boot-log');
  const nameInput = document.getElementById('player-name');
  const overNameEl = document.getElementById('over-name');
  const rankScreen = document.getElementById('rank-screen');
  const rankListEl = document.getElementById('rank-list');
  const rankListOverEl = document.getElementById('rank-list-over');
  const rankBtn = document.getElementById('rank-btn');
  const rankBack = document.getElementById('rank-back');
  const overRankBtn = document.getElementById('over-rank-btn');
  const rankRetry = document.getElementById('rank-retry');
  const rankOver = document.getElementById('rank-over');
  const clearRankBtn = document.getElementById('clear-rank-btn');

  let lastEntryIdx = -1; // indice da ultima entrada inserida (para highlight)

  // Dimensões internas fixas (mundo de jogo)
  const VW = 480, VH = 720;
  function resize() {
    canvas.width = VW;
    canvas.height = VH;
    const styleW = Math.min(wrap.clientWidth, window.innerHeight * (VW/VH) * 1.2);
    const styleH = wrap.clientHeight;
    const ratio = Math.min(styleW / VW, styleH / VH);
    canvas.style.width = (VW * ratio) + 'px';
    canvas.style.height = (VH * ratio) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Áudio (Web Audio API, sem arquivos) ----------
  let audioCtx = null;
  let muted = false;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, vol, slideTo) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/data.length, 2);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol || 0.25, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1200;
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start(t);
  }
  const sfx = {
    flap: () => beep(520, 0.09, 'square', 0.12, 720),
    score: () => { beep(880, 0.08, 'triangle', 0.18); setTimeout(()=>beep(1175, 0.10, 'triangle', 0.18), 70); },
    hit: () => { noise(0.25, 0.35); beep(180, 0.30, 'sawtooth', 0.25, 70); },
    die: () => beep(300, 0.5, 'sawtooth', 0.2, 80)
  };
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '♪̸' : '♪';
    muteBtn.style.color = muted ? '#ff6b6b' : '#00e0c6';
    if (!muted) ensureAudio();
  });

  // ---------- Splash WDM Games + boot log ----------
  const bootLines = [
    '> Inicializando WDM BIOS v2.4...',
    '> Detectando pendrive USB..... <span class="ok">OK</span>',
    '> Verificando pentes de RAM.. <span class="ok">OK</span>',
    '> Mapeando trilhas PCB...... <span class="ok">OK</span>',
    '> Carregando Flappy OS...... <span class="ok">OK</span>',
    '> Sistema pronto.'
  ];
  let bootIdx = 0;
  function bootStep() {
    if (bootIdx >= bootLines.length) return;
    bootLog.innerHTML += bootLines[bootIdx] + '\n';
    bootIdx++;
    setTimeout(bootStep, 350 + Math.random()*250);
  }
  bootStep();

  let splashGone = false;
  function dismissSplash() {
    if (splashGone) return;
    splashGone = true;
    splash.classList.add('out');
    ensureAudio();
    setTimeout(() => { splash.style.display = 'none'; }, 500);
  }
  splash.addEventListener('click', dismissSplash);
  splash.addEventListener('touchstart', e => { e.preventDefault(); dismissSplash(); }, {passive:false});
  document.addEventListener('keydown', function s(e){
    if (splashGone) { document.removeEventListener('keydown', s); return; }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); dismissSplash(); }
  });
  // auto-dismiss após 6s
  setTimeout(dismissSplash, 6000);

  // ---------- Nome do jogador ----------
  let playerName = localStorage.getItem('flappyPendriveName') || '';
  if (playerName) nameInput.value = playerName;
  nameInput.addEventListener('input', () => {
    let v = nameInput.value.toUpperCase().slice(0, 10);
    nameInput.value = v;
    playerName = v;
    localStorage.setItem('flappyPendriveName', v);
  });

  function getCurrentName() {
    const v = (nameInput.value || '').trim().toUpperCase();
    return v ? v.slice(0, 10) : 'JOGADOR';
  }

  // ---------- Ranking (localStorage) ----------
  const RANK_KEY = 'flappyPendriveRank';
  function loadRank() {
    try { return JSON.parse(localStorage.getItem(RANK_KEY) || '[]'); }
    catch(e){ return []; }
  }
  function saveRank(arr) {
    localStorage.setItem(RANK_KEY, JSON.stringify(arr));
  }
  function addRankEntry(name, sc) {
    const arr = loadRank();
    const entry = { name, score: sc, date: Date.now() };
    arr.push(entry);
    arr.sort((a,b) => b.score - a.score || a.date - b.date);
    const trimmed = arr.slice(0, 50);
    saveRank(trimmed);
    return trimmed.findIndex(e => e.name === entry.name && e.date === entry.date && e.score === entry.score);
  }
  function personalBest(name) {
    const arr = loadRank();
    let best = 0;
    for (const e of arr) if (e.name === name && e.score > best) best = e.score;
    return best;
  }
  function renderRank(container, highlightIdx) {
    const arr = loadRank();
    container.innerHTML = '';
    if (!arr.length) {
      container.innerHTML = '<li class="rank-empty">Nenhuma pontuação ainda. Jogue!</li>';
      return;
    }
    arr.forEach((e, i) => {
      const li = document.createElement('li');
      let cls = '';
      if (i === 0) cls = 'top1';
      else if (i === 1) cls = 'top2';
      else if (i === 2) cls = 'top3';
      if (i === highlightIdx) cls += ' me';
      li.className = cls;
      const m = medalFor(e.score);
      li.innerHTML =
        '<span class="pos">' + (i+1) + '.</span>' +
        '<span class="pname">' + e.name + '</span>' +
        '<span class="pscore">' + e.score + '</span>' +
        (m.icon ? '<span class="pmedal">' + m.icon + '</span>' : '');
      container.appendChild(li);
    });
  }

  // ---------- Estado do jogo ----------
  const BASE_SPEED = 2.6;
  const BASE_GAP = 190;
  const PIPE_W = 78;
  const PIPE_SPACING = 240;
  const PENDRIVE_W = 56;
  const PENDRIVE_H = 34;
  const G = 0.42;
  const FLAP = -8.2;
  const GROUND_H = 56;

  let bird, pipes, particles, trail, score, frame, state, shake, flash, speed, gap, lastTier, levelFlash;

  function reset() {
    bird = { x: VW*0.32, y: VH*0.5, vy: 0, rot: 0, alive: true };
    pipes = [];
    particles = [];
    trail = [];
    for (let i=0;i<4;i++) addPipe(VW + i*PIPE_SPACING + 100);
    score = 0;
    frame = 0;
    speed = BASE_SPEED;
    gap = BASE_GAP;
    shake = 0;
    flash = 0;
    lastTier = 0;
    levelFlash = null;
    scoreDisplay.textContent = '0';
  }

  function addPipe(x) {
    const margin = 90;
    const gapY = margin + Math.random()*(VH - margin*2 - gap*0.5);
    pipes.push({ x:x, gapY:gapY, passed:false });
  }

  function medalFor(s) {
    if (s >= 40) return { icon: '🏆', name: 'PLATINA' };
    if (s >= 25) return { icon: '🥇', name: 'OURO' };
    if (s >= 15) return { icon: '🥈', name: 'PRATA' };
    if (s >= 5)  return { icon: '🥉', name: 'BRONZE' };
    return { icon: '', name: '' };
  }

  function start() {
    reset();
    state = 'play';
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    rankScreen.classList.add('hidden');
    rankOver.classList.add('hidden');
    scoreDisplay.style.display = 'block';
    ensureAudio();
  }

  function gameOver() {
    if (state === 'over') return;
    state = 'over';
    bird.alive = false;
    scoreDisplay.style.display = 'none';
    overScore.textContent = score;
    const m = medalFor(score);
    medalIcon.textContent = m.icon;
    medalName.textContent = m.name;

    const pname = getCurrentName();
    overNameEl.textContent = pname;
    const prevBest = personalBest(pname);
    const isNewPersonal = score > prevBest && score > 0;
    if (isNewPersonal) newRecord.classList.remove('hidden');
    else newRecord.classList.add('hidden');

    if (score > 0) lastEntryIdx = addRankEntry(pname, score);
    else lastEntryIdx = -1;

    overBest.textContent = Math.max(prevBest, score);

    shake = 18;
    flash = 1;
    sfx.hit();
    setTimeout(sfx.die, 280);
    spawnParticles(bird.x, bird.y, 30, true);
    setTimeout(() => overScreen.classList.remove('hidden'), 700);
  }

  function spawnParticles(x, y, n, isHit) {
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const sp = isHit ? (1 + Math.random()*5) : (0.5 + Math.random()*1.5);
      particles.push({
        x, y,
        vx: Math.cos(a)*sp,
        vy: Math.sin(a)*sp - (isHit?0:1),
        life: 1,
        decay: 0.02 + Math.random()*0.02,
        color: isHit
          ? (['#ff6b6b','#ffd56b','#ff9c6b','#ff5252','#fff'][Math.floor(Math.random()*5)])
          : '#b3e5fc',
        size: isHit ? (2 + Math.random()*3) : (1.5 + Math.random()*1.5),
        grav: isHit ? 0.18 : 0.05
      });
    }
  }

  function flap() {
    if (state === 'idle') { start(); }
    if (state === 'play' && bird.alive) {
      bird.vy = FLAP;
      sfx.flap();
      spawnParticles(bird.x - 12, bird.y + 6, 5, false);
    }
  }

  // ---------- LEDs e pads de circuito (decoração) ----------
  const leds = [];
  for (let i=0;i<22;i++) leds.push({
    x: Math.random()*VW,
    y: Math.random()*(VH - GROUND_H - 40),
    r: 1.6 + Math.random()*1.8,
    color: ['#ff5252','#00e676','#ffd56b','#40c4ff'][Math.floor(Math.random()*4)],
    onAt: Math.floor(Math.random()*60),
    offAt: 0,
    period: 40 + Math.floor(Math.random()*80)
  });

  reset();
  state = 'idle';

  // ---------- Input ----------
  function onInput(e) {
    e.preventDefault();
    flap();
  }
  canvas.addEventListener('mousedown', onInput);
  canvas.addEventListener('touchstart', onInput, {passive:false});
  document.addEventListener('keydown', e => {
    if (document.activeElement === nameInput) return;
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      flap();
    }
  });
  nameInput.addEventListener('keydown', e => {
    if (e.code === 'Enter') { e.preventDefault(); start(); }
  });
  startBtn.addEventListener('click', start);
  retryBtn.addEventListener('click', start);

  // ---------- Handlers de ranking ----------
  rankBtn.addEventListener('click', () => {
    renderRank(rankListEl, -1);
    startScreen.classList.add('hidden');
    rankScreen.classList.remove('hidden');
  });
  rankBack.addEventListener('click', () => {
    rankScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
  });
  overRankBtn.addEventListener('click', () => {
    renderRank(rankListOverEl, lastEntryIdx);
    overScreen.classList.add('hidden');
    rankOver.classList.remove('hidden');
  });
  rankRetry.addEventListener('click', start);
  clearRankBtn.addEventListener('click', () => {
    if (confirm('Apagar todo o ranking?')) {
      localStorage.removeItem(RANK_KEY);
      renderRank(rankListEl, -1);
    }
  });

  // ---------- Desenho ----------
  function drawBackground() {
    // base da placa-mãe: gradiente verde-PC escuro
    const bg = ctx.createLinearGradient(0, 0, 0, VH);
    bg.addColorStop(0, '#0a2a14');
    bg.addColorStop(0.5, '#0e3a1c');
    bg.addColorStop(1, '#0a2a14');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, VW, VH);

    // grão sutil (linhas verticais) - textura de PCB
    ctx.strokeStyle = 'rgba(20, 70, 40, 0.25)';
    ctx.lineWidth = 1;
    for (let x = 0; x < VW; x += 18) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, VH - GROUND_H);
      ctx.stroke();
    }

    // trilhas de circuito (linhas verdes/douradas) com curvas em L
    ctx.strokeStyle = 'rgba(180, 150, 60, 0.35)';
    ctx.lineWidth = 2;
    const offset = (frame * 0.3) % 60;
    for (let i = 0; i < 8; i++) {
      const yBase = 40 + i * 80;
      ctx.beginPath();
      ctx.moveTo(-20, yBase);
      // zigzag horizontal com subidas/descidas
      let x = -20, y = yBase;
      while (x < VW + 20) {
        const nx = x + 60;
        ctx.lineTo(nx, y);
        y = yBase + (Math.floor(x / 60 + i) % 2 === 0 ? 24 : -24);
        ctx.lineTo(nx + 12, y);
        x = nx + 12;
      }
      ctx.stroke();
      // pads (pontos dourados) nas curvas
      ctx.fillStyle = 'rgba(212, 160, 23, 0.5)';
      for (let x = -20 + offset; x < VW + 20; x += 72) {
        ctx.beginPath();
        ctx.arc(x, yBase, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // vias (ilhas metálicas) - pads no PCB
    ctx.fillStyle = 'rgba(220, 180, 90, 0.18)';
    for (let i = 0; i < 14; i++) {
      const vx = (i * 67 + 20) % VW;
      const vy = (i * 53 + 30) % (VH - GROUND_H - 30);
      ctx.beginPath();
      ctx.arc(vx, vy, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(120, 90, 30, 0.4)';
      ctx.beginPath();
      ctx.arc(vx, vy, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(220, 180, 90, 0.18)';
    }

    // LEDs de status piscando
    for (const l of leds) {
      const lit = (frame % l.period) < (l.period * 0.5);
      if (lit) {
        // brilho
        const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r * 4);
        g.addColorStop(0, l.color);
        g.addColorStop(0.3, l.color.replace(')', ',0.4)').replace('rgb', 'rgba'));
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(l.x, l.y, l.r * 4, 0, Math.PI * 2);
        ctx.fill();
        // núcleo
        ctx.fillStyle = l.color;
        ctx.beginPath();
        ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(40, 40, 40, 0.6)';
        ctx.beginPath();
        ctx.arc(l.x, l.y, l.r * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // chips SMD soltos pelo fundo (parallax lento)
    ctx.fillStyle = 'rgba(15, 15, 15, 0.6)';
    for (let i = 0; i < 5; i++) {
      const bx = ((frame * 0.4 + i * 220) % (VW + 260)) - 130;
      const by = VH - 160 - (i % 3) * 30;
      ctx.fillRect(bx, by, 80, 36);
      ctx.fillStyle = 'rgba(40, 40, 40, 0.7)';
      ctx.fillRect(bx + 8, by + 8, 16, 16);
      ctx.fillStyle = 'rgba(15, 15, 15, 0.6)';
      // pinos dourados do chip
      ctx.fillStyle = 'rgba(201, 162, 39, 0.5)';
      for (let p = 0; p < 6; p++) {
        ctx.fillRect(bx + 14 + p * 10, by - 3, 4, 3);
        ctx.fillRect(bx + 14 + p * 10, by + 36, 4, 3);
      }
      ctx.fillStyle = 'rgba(15, 15, 15, 0.6)';
    }

    // chão: trilho da placa (faixa dourada)
    const groundY = VH - GROUND_H;
    const grad = ctx.createLinearGradient(0, groundY, 0, VH);
    grad.addColorStop(0, '#1a1a1a');
    grad.addColorStop(0.4, '#2a2a2a');
    grad.addColorStop(1, '#0d0d0d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, groundY, VW, GROUND_H);
    // faixa dourada (conector do slot)
    ctx.fillStyle = '#d4a017';
    ctx.fillRect(0, groundY, VW, 6);
    ctx.fillStyle = '#8a6d0f';
    ctx.fillRect(0, groundY + 6, VW, 2);
    // divisores do slot (pinos)
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    for (let i = -1; i < (VW / 30) + 2; i++) {
      const px = ((i * 30 - frame * speed) % 30);
      ctx.fillRect(i * 30 + px, groundY + 8, 3, GROUND_H - 8);
    }
  }

  function drawPendrive(x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    // sombra no solo (projecao)
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    const groundY = VH - GROUND_H;
    const dist = Math.max(0, groundY - y);
    const sh = Math.max(2, 6 - dist*0.02);
    ctx.ellipse(0, groundY - y, PENDRIVE_W/2 - dist*0.04, sh, 0, 0, Math.PI*2);
    ctx.fill();

    // conector metálico (na frente)
    const cw = 16, ch = 22;
    ctx.fillStyle = '#c9c9c9';
    ctx.fillRect(PENDRIVE_W/2 - 2, -ch/2, cw, ch);
    ctx.fillStyle = '#9a9a9a';
    ctx.fillRect(PENDRIVE_W/2 - 2, -ch/2, cw, 4);
    // contatos dourados
    ctx.fillStyle = '#e0b020';
    for (let i=0;i<4;i++){
      ctx.fillRect(PENDRIVE_W/2 + 2, -ch/2 + 7 + i*3.2, 9, 1.6);
    }

    // corpo do pendrive
    ctx.fillStyle = '#1565c0';
    roundRect(-PENDRIVE_W/2, -PENDRIVE_H/2, PENDRIVE_W - 4, PENDRIVE_H, 6, true, false);
    // detalhe superior (tampa/label)
    ctx.fillStyle = '#0d47a1';
    roundRect(-PENDRIVE_W/2 + 4, -PENDRIVE_H/2 + 4, PENDRIVE_W - 12, PENDRIVE_H - 8, 4, true, false);
    // label branco
    ctx.fillStyle = '#e3f2fd';
    ctx.fillRect(-PENDRIVE_W/2 + 8, -4, 18, 8);
    ctx.fillStyle = '#90caf9';
    ctx.fillRect(-PENDRIVE_W/2 + 8, 2, 18, 2);
    // LED de acesso (pisca ao pontuar)
    ctx.fillStyle = (state==='play' && (frame%30<10)) ? '#ff5252' : '#7a2a2a';
    ctx.beginPath();
    ctx.arc(-PENDRIVE_W/2 + 6, 0, 2.2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawTrail() {
    for (let i=0;i<trail.length;i++){
      const t = trail[i];
      const a = i / trail.length;
      ctx.fillStyle = `rgba(120, 200, 255, ${a*0.35})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, 3 + a*3, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawRAM(x, top, height, flipped) {
    ctx.save();
    if (flipped) {
      ctx.translate(x + PIPE_W, top + height);
      ctx.scale(-1, -1);
    } else {
      ctx.translate(x, top);
    }
    const w = PIPE_W, h = height;
    // corpo verde placa
    ctx.fillStyle = '#1b5e20';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(3, 0, w-6, h);
    // borda PCB mais escura
    ctx.fillStyle = '#0b3d0f';
    ctx.fillRect(0, 0, w, 3);
    ctx.fillRect(0, h-3, w, 3);
    // chips pretos
    const chipH = 18;
    const usable = h - 16;
    const chipCount = Math.max(1, Math.floor(usable/30));
    for (let i=0;i<chipCount && i<6;i++){
      const cy = 10 + i*28;
      if (cy + chipH > h - 10) break;
      ctx.fillStyle = '#161616';
      ctx.fillRect(8, cy, w-16, chipH);
      ctx.fillStyle = '#262626';
      ctx.fillRect(8, cy, w-16, 3);
      ctx.fillStyle = '#c9a227';
      for (let p=0;p<7;p++){
        ctx.fillRect(10 + p*((w-20)/6) - 0.5, cy+chipH, 1.6, 4);
        ctx.fillRect(10 + p*((w-20)/6) - 0.5, cy-4, 1.6, 4);
      }
    }
    // conectores dourados na borda da placa
    ctx.fillStyle = '#d4a017';
    ctx.fillRect(6, h-6, w-12, 6);
    ctx.fillStyle = '#8a6d0f';
    for (let p=0;p<10;p++){
      ctx.fillRect(8 + p*((w-16)/9), h-6, 2, 6);
    }
    // notch (fenda)
    ctx.fillStyle = '#0b3d0f';
    ctx.fillRect(w/2 - 3, 6, 6, 4);
    ctx.restore();
  }

  function roundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    if(fill) ctx.fill();
    if(stroke) ctx.stroke();
  }

  function popScore() {
    scoreDisplay.classList.add('pop');
    setTimeout(() => scoreDisplay.classList.remove('pop'), 110);
  }

  // ---------- Loop ----------
  function update() {
    frame++;
    if (state === 'play' && bird.alive) {
      bird.vy += G;
      bird.y += bird.vy;
      const targetRot = Math.max(-0.45, Math.min(1.4, bird.vy*0.08));
      bird.rot += (targetRot - bird.rot)*0.18;

      // dificuldade tierada a cada 7 pontos
      const tier = Math.floor(score / 7);
      if (tier !== lastTier) {
        lastTier = tier;
        if (tier > 0) {
          levelFlash = { text: 'FASE ' + (tier + 1), t: 1 };
          spawnParticles(bird.x, bird.y, 12, false);
          sfx.score();
        }
      }
      speed = Math.min(BASE_SPEED + 4.0, BASE_SPEED + tier * 0.4);
      gap = Math.max(130, BASE_GAP - tier * 15);

      // rastro
      trail.push({ x: bird.x - 6, y: bird.y });
      if (trail.length > 14) trail.shift();

      // mover obstáculos
      for (const p of pipes) p.x -= speed;
      if (pipes.length && pipes[0].x + PIPE_W < -10) pipes.shift();
      const last = pipes[pipes.length-1];
      if (!last || last.x < VW - PIPE_SPACING) addPipe((last?last.x:VW) + PIPE_SPACING);

      // pontuação
      for (const p of pipes) {
        if (!p.passed && p.x + PIPE_W < bird.x - PENDRIVE_W/2) {
          p.passed = true;
          score++;
          scoreDisplay.textContent = score;
          popScore();
          sfx.score();
          spawnParticles(bird.x + 20, bird.y, 8, false);
        }
      }

      // colisões
      const groundY = VH - GROUND_H;
      const ceilY = 8;
      if (bird.y + PENDRIVE_H/2 > groundY || bird.y - PENDRIVE_H/2 < ceilY) {
        bird.y = Math.min(groundY - PENDRIVE_H/2, Math.max(ceilY + PENDRIVE_H/2, bird.y));
        gameOver();
      }
      for (const p of pipes) {
        const inX = bird.x + PENDRIVE_W/2 > p.x && bird.x - PENDRIVE_W/2 < p.x + PIPE_W;
        if (inX) {
          if (bird.y - PENDRIVE_H/2 < p.gapY - gap/2 ||
              bird.y + PENDRIVE_H/2 > p.gapY + gap/2) {
            gameOver();
          }
        }
      }
    } else if (state === 'idle') {
      bird.y = VH*0.5 + Math.sin(frame*0.06)*8;
      bird.rot = Math.sin(frame*0.06)*0.1;
    } else if (state === 'over') {
      if (bird.y < VH - GROUND_H - PENDRIVE_H/2) {
        bird.vy += G;
        bird.y += bird.vy;
        bird.rot += 0.05;
      }
    }

    // partículas
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.grav;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i,1);
    }

    // decaimento de efeitos
    if (shake > 0) shake = Math.max(0, shake - 0.8);
    if (flash > 0) flash = Math.max(0, flash - 0.05);
    if (levelFlash) {
      levelFlash.t -= 0.012;
      if (levelFlash.t <= 0) levelFlash = null;
    }
  }

  function render() {
    ctx.save();
    // tremor de tela
    if (shake > 0) {
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }
    ctx.clearRect(0,0,VW,VH);
    drawBackground();
    drawTrail();
    // obstáculos
    for (const p of pipes) {
      drawRAM(p.x, 0, p.gapY - gap/2, false);
      drawRAM(p.x, p.gapY + gap/2, (VH-GROUND_H) - (p.gapY + gap/2), true);
    }
    drawPendrive(bird.x, bird.y, bird.rot);
    // partículas
    for (const p of particles){
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // flash branco no impacto
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash*0.6})`;
      ctx.fillRect(0,0,VW,VH);
    }
    // aviso de fase ao subir de tier
    if (levelFlash) {
      const t = levelFlash.t;
      const a = Math.min(1, t * 2) * (t < 0.2 ? t/0.2 : 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const scale = 1 + (1 - t) * 0.4;
      ctx.translate(VW/2, VH*0.38);
      ctx.scale(scale, scale);
      ctx.font = '900 44px Segoe UI, sans-serif';
      ctx.fillStyle = '#00e0c6';
      ctx.shadowColor = 'rgba(0,224,198,0.8)';
      ctx.shadowBlur = 20;
      ctx.fillText(levelFlash.text, 0, 0);
      ctx.restore();
    }
  }

  const STEP_MS = 1000 / 50; // alvo ~50 FPS-equivalente (ritmo mais lento/calm)
  let lastTime = 0;
  let acc = 0;
  function loop(now) {
    now = now || performance.now();
    if (lastTime === 0) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    if (dt < 0) dt = 0;
    if (dt > 250) dt = 250; // ignora pausas grandes (aba em background)
    acc += dt;
    let steps = 0;
    while (acc >= STEP_MS && steps < 5) {
      update();
      acc -= STEP_MS;
      steps++;
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
