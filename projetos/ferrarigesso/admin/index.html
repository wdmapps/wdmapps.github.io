<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferrari Gesso | Administração</title><style>:root{--gold:#d7aa43;--bg:#0d0f11;--card:#191c1f;--green:#25d366}*{box-sizing:border-box}body{margin:0;background:#111417;color:#eee;font-family:Arial}.head{background:#070809;padding:22px}.wrap{width:min(1150px,92%);margin:auto}.head b{font-size:25px}.head span{color:var(--gold)}.grid{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:28px 0}.menu,.panel{background:var(--card);border:1px solid #303438;border-radius:12px;padding:18px}.menu button{display:block;width:100%;padding:12px;margin-bottom:7px;background:none;border:0;color:#ddd;text-align:left;border-radius:7px;font-weight:bold}.menu button:hover,.menu .active{background:#292d31;color:#e8c66a}.panel h1{margin-top:0}.notice{padding:13px;background:#24282b;border-left:4px solid var(--gold);margin-bottom:20px;color:#ccc}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.photo{background:#101214;border:1px solid #303438;border-radius:9px;overflow:hidden}.photo img{width:100%;height:180px;object-fit:cover}.photo div{padding:12px}.btn{display:inline-block;padding:9px 11px;background:#fff;color:#111;border-radius:6px;font-weight:bold;cursor:pointer}input{display:none}.save{background:var(--green);border:0;color:#fff;padding:13px 18px;border-radius:7px;font-weight:900;margin-top:20px}@media(max-width:750px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="wrap"><b>FERRARI <span>GESSO</span> • ADMINISTRAÇÃO</b></div></header><main class="wrap grid"><aside class="menu"><button class="active">🖼️ Carrossel</button><button>🧱 Serviços</button><button>📷 Galeria</button><button>⚙️ Dados</button><a style="color:#aaa;display:block;padding:12px" href="../">← Voltar ao site</a></aside><section class="panel"><h1>Imagens do site</h1><div class="notice">Painel WDM Apps. Nesta etapa as trocas podem ser visualizadas aqui; a gravação online será ativada com Firebase Storage e autenticação.</div><div class="photos"><div class="photo"><img id="p0" src="https://images.pexels.com/photos/7587304/pexels-photo-7587304.jpeg?auto=compress&cs=tinysrgb&w=800"><div><b>Imagem 1</b><br><br><label class="btn">Trocar foto<input type="file" accept="image/*" onchange="preview(this,'p0')"></label></div></div><div class="photo"><img id="p1" src="https://images.pexels.com/photos/15308554/pexels-photo-15308554.jpeg?auto=compress&cs=tinysrgb&w=800"><div><b>Imagem 2</b><br><br><label class="btn">Trocar foto<input type="file" accept="image/*" onchange="preview(this,'p1')"></label></div></div><div class="photo"><img id="p2" src="https://images.pexels.com/photos/12715594/pexels-photo-12715594.jpeg?auto=compress&cs=tinysrgb&w=800"><div><b>Imagem 3</b><br><br><label class="btn">Trocar foto<input type="file" accept="image/*" onchange="preview(this,'p2')"></label></div></div></div><button class="save" onclick="alert('Preview salvo localmente. A publicação será ativada após conectar o Firebase.')">SALVAR ALTERAÇÕES</button></section></main><script>function preview(i,id){if(i.files[0])document.getElementById(id).src=URL.createObjectURL(i.files[0])}</script></body></html>
